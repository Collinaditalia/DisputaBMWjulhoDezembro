<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏁 BMW Champions League - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --card: #1a1a1a;
            --card-hover: #222;
            --border: #2a2a2a;
            --bmw-blue: #0066B1;
            --bmw-light: #1E93E1;
            --bmw-red: #E30613;
            --bmw-dark: #003D6B;
            --text: #e0e0e0;
            --text-dim: #999;
            --text-bright: #fff;
            --gold: #f0c040;
            --silver: #b0b0b0;
            --bronze: #cd7f32;
            --green: #00c853;
            --accent-glow: 0 0 25px rgba(0, 102, 177, 0.4);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0, 102, 177, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(227, 6, 19, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(30, 147, 225, 0.03) 0%, transparent 70%);
        }

        /* BMW X1 marca d'água */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1617531653332-bad972bddd65?w=1400&q=80');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            opacity: 0.04;
            z-index: 0;
            pointer-events: none;
        }

        #loginOverlay,
        #dashboard {
            position: relative;
            z-index: 1;
        }

        /* ============ LOGIN OVERLAY ============ */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #loginOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px;
            width: 420px;
            max-width: 95vw;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), var(--accent-glow);
            position: relative;
            overflow: hidden;
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--bmw-blue), var(--bmw-light), var(--bmw-red));
        }
        .login-logo {
            font-size: 52px;
            margin-bottom: 8px;
            display: block;
        }
        .login-title {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .login-box .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .login-box .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.95rem;
            transition: var(--transition);
            z-index: 1;
        }
        .login-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-bright);
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }
        .login-box input:focus {
            border-color: var(--bmw-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 177, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--bmw-blue), var(--bmw-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transition);
            margin-top: 8px;
            text-transform: uppercase;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, var(--bmw-light), var(--bmw-blue));
            box-shadow: var(--accent-glow);
            transform: translateY(-1px);
        }
        .login-error {
            color: var(--bmw-red);
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 20px;
        }
        .login-footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .bmw-stripes {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .bmw-stripe {
            width: 32px;
            height: 4px;
            border-radius: 2px;
        }
        .bmw-stripe:nth-child(1) {
            background: var(--bmw-blue);
        }
        .bmw-stripe:nth-child(2) {
            background: #8B6CAD;
        }
        .bmw-stripe:nth-child(3) {
            background: var(--bmw-red);
        }

        /* ============ MAIN DASHBOARD ============ */
        #dashboard {
            display: none;
            min-height: 100vh;
        }
        #dashboard.active {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--bmw-blue), var(--bmw-light), var(--bmw-red));
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }
        .header-brand .icon {
            font-size: 1.6rem;
        }
        .header-brand .title-text {
            background: linear-gradient(135deg, var(--bmw-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-brand .champions {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            -webkit-text-fill-color: var(--gold);
        }
        .header-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-badge {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-badge .role {
            font-size: 0.7rem;
            background: var(--bmw-blue);
            color: #fff;
            padding: 2px 10px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            white-space: nowrap;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logout-btn:hover {
            border-color: var(--bmw-red);
            color: var(--bmw-red);
        }

        /* Tab Nav */
        .tab-nav {
            display: flex;
            gap: 4px;
            padding: 16px 28px 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-wrap: nowrap;
        }
        .tab-btn {
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: var(--transition);
            white-space: nowrap;
            position: relative;
            letter-spacing: 0.3px;
        }
        .tab-btn:hover {
            color: var(--text-bright);
            background: rgba(255, 255, 255, 0.03);
        }
        .tab-btn.active {
            color: var(--bmw-light);
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-color: var(--surface);
            margin-bottom: -1px;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--bmw-blue);
            border-radius: 3px 3px 0 0;
        }

        /* Main Content */
        .main-content {
            padding: 24px 28px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .tab-panel {
            display: none;
            animation: fadeSlideIn 0.35s ease;
        }
        .tab-panel.active {
            display: block;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .kpi-card:hover {
            border-color: #3a3a3a;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .kpi-card .kpi-icon {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--bmw-light);
        }
        .kpi-card .kpi-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .kpi-card .kpi-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }
        .kpi-card .kpi-sub {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .kpi-card.accent-blue {
            border-left: 3px solid var(--bmw-blue);
        }
        .kpi-card.accent-red {
            border-left: 3px solid var(--bmw-red);
        }
        .kpi-card.accent-gold {
            border-left: 3px solid var(--gold);
        }
        .kpi-card.accent-green {
            border-left: 3px solid var(--green);
        }

        /* Tables */
        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-bright);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        table thead th {
            background: #111;
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        table tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid #1f1f1f;
            white-space: nowrap;
        }
        table tbody tr {
            transition: var(--transition);
        }
        table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        table tbody tr.rank-1 {
            background: rgba(240, 192, 64, 0.07);
        }
        table tbody tr.rank-2 {
            background: rgba(176, 176, 176, 0.04);
        }
        table tbody tr.rank-3 {
            background: rgba(205, 127, 50, 0.05);
        }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.8rem;
        }
        .rank-badge.r1 {
            background: var(--gold);
            color: #000;
        }
        .rank-badge.r2 {
            background: var(--silver);
            color: #000;
        }
        .rank-badge.r3 {
            background: var(--bronze);
            color: #000;
        }
        .rank-badge.rn {
            background: #2a2a2a;
            color: #888;
        }

        /* XP tag */
        .xp-tag {
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            letter-spacing: -0.5px;
        }
        .xp-highlight {
            color: var(--bmw-light);
            font-size: 1rem;
        }

        /* Section title */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: var(--bmw-light);
        }

        /* Admin */
        .admin-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .admin-controls input {
            flex: 1;
            min-width: 300px;
            padding: 10px 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-bright);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }
        .admin-controls input:focus {
            border-color: var(--bmw-blue);
        }
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            border: none;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--bmw-blue);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--bmw-light);
            box-shadow: var(--accent-glow);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--bmw-blue);
            color: var(--bmw-light);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: var(--bmw-red);
            color: #fff;
        }

        /* ============ PRESENÇA CALENDAR ============ */
        .presenca-selector {
            margin-bottom: 20px;
        }
        .presenca-selector select {
            padding: 10px 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-bright);
            font-size: 0.9rem;
            outline: none;
            min-width: 280px;
        }
        .presenca-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }
        .presenca-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .leg-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }
        .leg-dot.presente {
            background: #00c853;
        }
        .leg-dot.falta {
            background: #e53935;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 20px;
            max-width: 600px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 0;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 2px solid transparent;
            user-select: none;
            position: relative;
            min-width: 44px;
            min-height: 44px;
        }
        .calendar-day .day-num {
            font-size: 1rem;
        }
        .calendar-day .day-label {
            font-size: 0.55rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .calendar-day.state-presente {
            background: rgba(0, 200, 83, 0.2);
            border-color: #00c853;
            color: #00c853;
        }
        .calendar-day.state-falta {
            background: rgba(229, 57, 53, 0.2);
            border-color: #e53935;
            color: #e53935;
        }
        .calendar-day.state-undefined {
            background: rgba(255, 255, 255, 0.03);
            border-color: #333;
            color: #666;
        }
        .calendar-day:hover {
            transform: scale(1.05);
            border-color: #fff;
            z-index: 2;
        }
        .presenca-summary {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 16px;
        }
        .presenca-summary .sum-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            text-align: center;
            min-width: 100px;
        }
        .presenca-summary .sum-value {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .presenca-summary .sum-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sum-value.green {
            color: #00c853;
        }
        .sum-value.red {
            color: #e53935;
        }

        /* Status toggle */
        .status-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: var(--transition);
            border: 2px solid var(--border);
            user-select: none;
        }
        .status-toggle.ativo {
            background: rgba(0, 200, 83, 0.15);
            border-color: #00c853;
            color: #00c853;
        }
        .status-toggle.inativo {
            background: rgba(229, 57, 53, 0.15);
            border-color: #e53935;
            color: #e53935;
        }
        .status-toggle .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .status-toggle.ativo .status-dot {
            background: #00c853;
            box-shadow: 0 0 8px rgba(0, 200, 83, 0.5);
        }
        .status-toggle.inativo .status-dot {
            background: #e53935;
            box-shadow: 0 0 8px rgba(229, 57, 53, 0.5);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            z-index: 999;
            font-size: 0.85rem;
            animation: slideUp 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .toast.success {
            border-left: 3px solid var(--green);
        }
        .toast.error {
            border-left: 3px solid var(--bmw-red);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Regras */
        .regras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
        }
        .regras-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .regras-card h3 {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .regras-card ul {
            list-style: none;
            padding: 0;
            font-size: 0.83rem;
            line-height: 1.9;
        }
        .regras-card ul li {
            padding: 3px 0;
            border-bottom: 1px solid #1f1f1f;
        }

        /* VGV Ponderado highlight */
        .vgv-ponderado {
            color: var(--bmw-light);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 0 12px;
                height: 56px;
            }
            .header-brand {
                font-size: 0.9rem;
                gap: 6px;
            }
            .header-brand .icon {
                font-size: 1.2rem;
            }
            .header-user {
                gap: 8px;
            }
            .user-badge {

    <div id="toastContainer"></div>

    <script>
        // ==================== CONFIG ====================
        const DEFAULT_CSV_URL = 'https://raw.githubusercontent.com/USER/REPO/main/dados.csv';
        const CAMPAIGN_START = '2026-07-01';
        const CAMPAIGN_END = '2026-07-31';
        const TOTAL_DIAS_CAMPANHA = 31;
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'admin123';
        const STORAGE_PRESENCA = 'bmw_presenca';
        const STORAGE_ATIVO = 'bmw_ativo';
        const STORAGE_CSV_URL = 'bmw_dash_csv_url';

        // ==================== STATE ====================
        let currentUser = null;
        let rawCSVData = [];
        let processedSellers = [];
        let csvUrl = localStorage.getItem(STORAGE_CSV_URL) || DEFAULT_CSV_URL;

        // ==================== DOM ====================
        const $loginOverlay = document.getElementById('loginOverlay');
        const $dashboard = document.getElementById('dashboard');
        const $loginError = document.getElementById('loginError');
        const $csvUrlInput = document.getElementById('csvUrlInput');
        const $csvStatus = document.getElementById('csvStatus');

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            $csvUrlInput.value = csvUrl;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });
            document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter')
            doLogin(); });
            document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('loginPass').focus(); });
            loadCSVData();
        });

        // ==================== LOCAL STORAGE HELPERS ====================
        function getPresencaData() {
            try { return JSON.parse(localStorage.getItem(STORAGE_PRESENCA) || '{}'); } catch (e) { return {}; }
        }

        function setPresencaData(data) { localStorage.setItem(STORAGE_PRESENCA, JSON.stringify(data)); }

        function getPresencaFor(vendedor) {
            const data = getPresencaData();
            return data[vendedor] || null;
        }

        function setPresencaFor(vendedor, diasArray) {
            const data = getPresencaData();
            data[vendedor] = diasArray;
            setPresencaData(data);
        }

        function getAtivoData() {
            try { return JSON.parse(localStorage.getItem(STORAGE_ATIVO) || '{}'); } catch (e) { return {}; }
        }

        function setAtivoData(data) { localStorage.setItem(STORAGE_ATIVO, JSON.stringify(data)); }

        function isAtivo(vendedor) {
            const data = getAtivoData();
            return data[vendedor] !== false;
        }

        function setAtivoStatus(vendedor, ativo) {
            const data = getAtivoData();
            data[vendedor] = ativo;
            setAtivoData(data);
        }

        function countDiasPresentesFromArray(arr) {
            if (!arr) return 0;
            return arr.filter(v => v === 1).length;
        }

        function initPresencaFromCSV(seller) {
            const arr = new Array(TOTAL_DIAS_CAMPANHA).fill(0);
            const dias = Math.min(seller.dias_presente, TOTAL_DIAS_CAMPANHA);
            for (let i = 0; i < dias; i++) arr[i] = 1;
            return arr;
        }

        // ==================== LOGIN ====================
        function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            $loginError.textContent = '';
            if (!user || !pass) { $loginError.textContent = 'Preencha usuário e senha.'; return; }
            if (user.toLowerCase() === ADMIN_USER && pass === ADMIN_PASS) {
                currentUser = { name: 'Administrador', role: 'admin', team: null };
                enterDashboard();
                return;
            }
            const seller = processedSellers.find(s => s.vendedor.toLowerCase() === user.toLowerCase() && s.senha ===
                pass);
            if (seller) {
                currentUser = { name: seller.vendedor, role: 'vendedor', team: seller.equipe, sellerData: seller };
                enterDashboard();
                return;
            }
            $loginError.textContent = 'Usuário ou senha inválidos.';
        }

        function enterDashboard() {
            $loginOverlay.classList.add('hidden');
            $dashboard.classList.add('active');
            document.getElementById('headerUserName').textContent = currentUser.name;
            document.getElementById('headerUserRole').textContent =
                currentUser.role === 'admin' ? 'ADMIN' : (currentUser.team || 'VENDEDOR');
            const adminBtns = document.querySelectorAll('.admin-only');
            adminBtns.forEach(b => b.style.display = currentUser.role === 'admin' ? '' : 'none');
            if (currentUser.role === 'admin') switchTab('admin');
            else switchTab('meus-numeros');
            renderAll();
        }

        function doLogout() {
            currentUser = null;
            $loginOverlay.classList.remove('hidden');
            $dashboard.classList.remove('active');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            $loginError.textContent = '';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const firstTab = document.querySelector('.tab-btn[data-tab="meus-numeros"]');
            if (firstTab) firstTab.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const firstPanel = document.getElementById('panel-meus-numeros');
            if (firstPanel) firstPanel.classList.add('active');
        }

        // ==================== TABS ====================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            const panel = document.getElementById(`panel-${tabId}`);
            if (btn) btn.classList.add('active');
            if (panel) panel.classList.add('active');
            if (tabId === 'meus-numeros') renderMeusNumeros();
            if (tabId === 'ranking') renderRanking();
            if (tabId === 'presenca') renderPresenca();
            if (tabId === 'status') renderStatus();
            if (tabId === 'admin') renderAdmin();
            if (tabId === 'regras') renderRegras();
        }

        // ==================== CSV ====================
        async function loadCSVData() {
            try {
                const resp = await fetch(csvUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                rawCSVData = parseCSV(text);
                processedSellers = processAllSellers(rawCSVData);
                if ($csvStatus) $csvStatus.textContent =
                    `✅ Dados carregados: ${processedSellers.length} vendedores em ${countTeams()} equipe(s).`;
                if (currentUser) {
                    if (currentUser.role === 'vendedor') {
                        const refreshed = processedSellers.find(s => s.vendedor.toLowerCase() === currentUser.name
                            .toLowerCase());
                        if (refreshed) currentUser.sellerData = refreshed;
                    }
                    renderAll();
                    const activeTab = document.querySelector('.tab-btn.active')?.dataset?.tab;
                    if (activeTab) switchTab(activeTab);
                }
            } catch (err) {
                console.warn('CSV não carregado:', err.message);
                if ($csvStatus) $csvStatus.textContent =
                    `⚠️ Usando dados de demonstração. (${err.message})`;
                rawCSVData = getDemoData();
                processedSellers = processAllSellers(rawCSVData);
                if (currentUser) { renderAll(); }
            }
        }

        async function reloadCSV() {
            csvUrl = $csvUrlInput.value.trim();
            localStorage.setItem(STORAGE_CSV_URL, csvUrl);
            showToast('Recarregando dados...', 'success');
            await loadCSVData();
            showToast('Dados atualizados!', 'success');
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_'));
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                if (values.length < headers.length) continue;
                const row = {};
                headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
                data.push(row);
            }
            return data;
        }

        function getDemoData() {
            return [
                { vendedor: 'João Silva', equipe: 'CAPTACAO', vgv: '5200000', num_vendas: '18', dias_presente: '22',
                    dias_pontual: '20', meetings: '5', eficiencia: '', entrada_efetiva: '', casais: '38',
                    data_inicio: '', senha: 'joao123' },
                { vendedor: 'Maria Santos', equipe: 'CONSULTORIA', vgv: '4100000', num_vendas: '14', dias_presente: '21',
                    dias_pontual: '19', meetings: '4', eficiencia: '35', entrada_efetiva: '', casais: '',
                    data_inicio: '', senha: 'maria123' },
                { vendedor: 'Pedro Costa', equipe: 'CLOSER', vgv: '3800000', num_vendas: '12', dias_presente: '20',
                    dias_pontual: '18', meetings: '3', eficiencia: '', entrada_efetiva: '5', casais: '',
                    data_inicio: '2026-07-05', senha: 'pedro123' },
                { vendedor: 'Ana Oliveira', equipe: 'CAPTACAO', vgv: '6100000', num_vendas: '22', dias_presente: '22',
                    dias_pontual: '21', meetings: '6', eficiencia: '', entrada_efetiva: '', casais: '45',
                    data_inicio: '', senha: 'ana123' },
                { vendedor: 'Lucas Mendes', equipe: 'CONSULTORIA', vgv: '3500000', num_vendas: '11', dias_presente: '20',
                    dias_pontual: '17', meetings: '2', eficiencia: '28', entrada_efetiva: '', casais: '',
                    data_inicio: '', senha: 'lucas123' },
                { vendedor: 'Carla Rocha', equipe: 'CLOSER', vgv: '4500000', num_vendas: '15', dias_presente: '22',
                    dias_pontual: '22', meetings: '4', eficiencia: '', entrada_efetiva: '7', casais: '',
                    data_inicio: '', senha: 'carla123' },
            ];
        }

        function countTeams() {
            return [...new Set(processedSellers.map(s => s.equipe))].length;
        }

        // ==================== PROCESSING ====================
        function processAllSellers(rawData) {
            const sellers = rawData.map(row => {
                const seller = {
                    vendedor: row.vendedor || 'Desconhecido',
                    equipe: (row.equipe || '').toUpperCase().trim(),
                    vgv: parseFloat(row.vgv) || 0,
                    num_vendas: parseInt(row.num_vendas) || 0,
                    dias_presente_csv: parseInt(row.dias_presente) || 0,
                    dias_pontual_csv: parseInt(row.dias_pontual) || 0,
                    meetings: parseInt(row.meetings) || 0,
                    eficiencia: parseFloat(row.eficiencia) || 0,
                    entrada_efetiva: parseFloat(row.entrada_efetiva) || 0,
                    casais: parseInt(row.casais) || 0,
                    data_inicio: row.data_inicio || '',
                    senha: row.senha || '123456',
                    ticket_medio: 0,
                    xp_breakdown: {},
                    xp_total: 0,
                    is_novato: false,
                    dias_presente: 0,
                    dias_pontual: 0,
                };
                if (seller.num_vendas > 0) seller.ticket_medio = seller.vgv / seller.num_vendas;
                if (seller.data_inicio && seller.data_inicio >= CAMPAIGN_START) seller.is_novato = true;

                // Presença via localStorage ou CSV
                let presencaArr = getPresencaFor(seller.vendedor);
                if (!presencaArr) {
                    presencaArr = initPresencaFromCSV(seller);
                    setPresencaFor(seller.vendedor, presencaArr);
                }
                seller.dias_presente = countDiasPresentesFromArray(presencaArr);
                seller.dias_pontual = seller.dias_pontual_csv;
                seller._presencaArr = presencaArr;

                return seller;
            });

            // Calcular XP
            sellers.forEach(s => calculateXP(s, sellers));

            // Rankings dentro de cada equipe
            ['CAPTACAO', 'CONSULTORIA', 'CLOSER'].forEach(team => {
                const teamSellers = sellers.filter(s => s.equipe === team && isAtivo(s.vendedor));
                const sortedByXP = [...teamSellers].sort((a, b) => b.xp_total - a.xp_total);
                sortedByXP.forEach((s, idx) => {
                    if (idx === 0) s.xp_breakdown.top = 600000;
                    else if (idx === 1) s.xp_breakdown.top = 400000;
                    else if (idx === 2) s.xp_breakdown.top = 200000;
                    else s.xp_breakdown.top = 0;
                });
                const sortedByTicket = [...teamSellers].sort((a, b) => b.ticket_medio - a.ticket_medio);
                sortedByTicket.forEach((s, idx) => {
                    if (idx === 0) s.xp_breakdown.ticket_medio_bonus = 300000;
                    else if (idx === 1) s.xp_breakdown.ticket_medio_bonus = 200000;
                    else if (idx === 2) s.xp_breakdown.ticket_medio_bonus = 100000;
                    else s.xp_breakdown.ticket_medio_bonus = 0;
                });
                teamSellers.forEach(s => {
                    s.xp_total = Object.values(s.xp_breakdown).reduce((sum, v) => sum + v, 0);
                });
            });

            sellers.sort((a, b) => b.xp_total - a.xp_total);
            return sellers;
        }

        function calculateXP(seller, allSellers) {
            const bp = {};
            const vgvMil = seller.vgv / 1000;
            if (seller.equipe === 'CONSULTORIA') bp.conversao = vgvMil * 1100;
            else if (seller.equipe === 'CLOSER') bp.conversao = vgvMil * 1000;
            else if (seller.equipe === 'CAPTACAO') bp.conversao = vgvMil * 1200;
            else bp.conversao = vgvMil * 1000;

            // Assiduidade
            if (seller.is_novato && seller.equipe === 'CONSULTORIA') {
                const nonNovatos = allSellers.filter(s => s.equipe === 'CONSULTORIA' && !s.is_novato);
                if (nonNovatos.length > 0) {
                    const minPres = Math.min(...nonNovatos.map(s => s.dias_presente));
                    const minPont = Math.min(...nonNovatos.map(s => s.dias_pontual));
                    bp.assiduidade_presenca = minPres * 50000;
                    bp.assiduidade_pontual = minPont * 50000;
                } else {
                    bp.assiduidade_presenca = seller.dias_presente * 50000;
                    bp.assiduidade_pontual = seller.dias_pontual * 50000;
                }
            } else if (seller.is_novato && (seller.equipe === 'CLOSER' || seller.equipe === 'CAPTACAO')) {
                const startDate = new Date(seller.data_inicio + 'T00:00:00-03:00');
                const campaignStart = new Date(CAMPAIGN_START + 'T00:00:00-03:00');
                const propBonus = Math.max(0, Math.ceil((startDate - campaignStart) / (1000 * 60 * 60 * 24)));
                bp.assiduidade_presenca = (seller.dias_presente + propBonus) * 50000;
                bp.assiduidade_pontual = (seller.dias_pontual + propBonus) * 50000;
            } else {
                bp.assiduidade_presenca = seller.dias_presente * 50000;
                bp.assiduidade_pontual = seller.dias_pontual * 50000;
            }

            bp.meetings = seller.meetings * 50000;
            bp.top = 0;
            bp.ticket_medio_bonus = 0;

            // Eficiência (CONSULTORIA)
            if (seller.equipe === 'CONSULTORIA' && seller.vgv >= 3000000) {
                const e = seller.eficiencia;
                if (e >= 60) bp.eficiencia = 2400000;
                else if (e >= 55) bp.eficiencia = 2200000;
                else if (e >= 50) bp.eficiencia = 2000000;
                else if (e >= 45) bp.eficiencia = 1800000;
                else if (e >= 40) bp.eficiencia = 1600000;
                else if (e >= 35) bp.eficiencia = 1400000;
                else if (e >= 30) bp.eficiencia = 1200000;
                else if (e >= 25) bp.eficiencia = 1000000;
                else if (e >= 20) bp.eficiencia = 600000;
                else bp.eficiencia = 0;
            } else bp.eficiencia = 0;

            // Entrada Efetiva (CLOSER)
            if (seller.equipe === 'CLOSER' && seller.vgv >= 3000000) {
                const ee = seller.entrada_efetiva;
                if (ee >= 10) bp.entrada_efetiva = 2400000;
                else if (ee >= 9) bp.entrada_efetiva = 2200000;
                else if (ee >= 8) bp.entrada_efetiva = 2000000;
                else if (ee >= 7) bp.entrada_efetiva = 1800000;
                else if (ee >= 6) bp.entrada_efetiva = 1600000;
                else if (ee >= 5) bp.entrada_efetiva = 1400000;
                else if (ee >= 4) bp.entrada_efetiva = 1200000;
                else if (ee >= 3) bp.entrada_efetiva = 1000000;
                else bp.entrada_efetiva = 0;
            } else bp.entrada_efetiva = 0;

            // Casais (CAPTAÇÃO)
            if (seller.equipe === 'CAPTACAO') {
                const c = seller.casais;
                if (c > 65) bp.casais = 400000;
                else if (c > 60) bp.casais = 370000;
                else if (c > 55) bp.casais = 340000;
                else if (c > 50) bp.casais = 300000;
                else if (c > 45) bp.casais = 270000;
                else if (c > 40) bp.casais = 240000;
                else if (c > 35) bp.casais = 200000;
                else if (c > 30) bp.casais = 170000;
                else if (c > 25) bp.casais = 140000;
                else if (c > 20) bp.casais = 100000;
                else bp.casais = 0;
            } else bp.casais = 0;

            seller.xp_breakdown = bp;
            seller.xp_total = Object.values(bp).reduce((sum, v) => sum + v, 0);
        }

        function getActiveSellers() {
            return processedSellers.filter(s => isAtivo(s.vendedor));
        }

        // ==================== FORMAT ====================
        function formatCurrency(value) {
            if (!value || isNaN(value)) return 'R$ 0,00';
            return 'R$ ' + Math.round(value).toLocaleString('pt-BR', { minimumFractionDigits: 2,
        maximumFractionDigits: 2 });
        }

        function formatXP(value) {
            if (!value || isNaN(value)) return '0 XP';
            return Math.round(value).toLocaleString('pt-BR') + ' XP';
        }

        function formatDateBR(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function getPesoXP(equipe) {
            if (equipe === 'CAPTACAO') return 1200;
            if (equipe === 'CONSULTORIA') return 1100;
            if (equipe === 'CLOSER') return 1000;
            return 1000;
        }

        // ==================== RENDER: MEUS NÚMEROS ====================
        function renderMeusNumeros() {
            const container = document.getElementById('meusNumerosContent');
            if (!currentUser || !container) return;

                            ${seller.equipe==='CLOSER'?`<tr><td><strong>Entrada Efetiva</strong></td><td>${seller.entrada_efetiva}% ${seller.vgv>=3000000?'✅':'❌'}</td><td class="xp-tag" style="color:${bp.entrada_efetiva>0?'var(--bmw-light)':'var(--text-dim)'};">${formatXP(bp.entrada_efetiva)}</td></tr>`:''}

        // ==================== RENDER: RANKING ====================
        function renderRanking() {
            const container = document.getElementById('rankingContent');
            if (!container) return;
            const ativos = getActiveSellers();
            if (ativos.length === 0) {
                container.innerHTML =
                    '<p style="color:var(--text-dim);">Nenhum vendedor ativo. Verifique o status na aba Ativo/Inativo.</p>';
                return;
            }

            let html = `
                <div class="section-title"><i class="fa-solid fa-trophy"></i> Ranking Geral — BMW Champions League</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>#</th><th>Vendedor</th><th>Equipe</th><th>VGV Realizado</th><th>XP Conversão (VGV × Peso)</th><th>Vendas</th><th>Ticket Médio</th><th>Presença</th><th>XP Total</th></tr>
                        </thead>
                        <tbody>`;

                const rankClass = idx < 3 ? `rank-${idx+1}` : '';

                    '<span class="rank-badge r3">3</span>'
                ];
                const rankBadge = idx < 3 ? badges[idx] :
                    `<span class="rank-badge rn">${idx+1}</span>`;
                const isCurrentUser = currentUser && currentUser.name === s.vendedor;
                const rowStyle = isCurrentUser ? 'background:rgba(0,102,177,0.12);font-weight:600;' : '';
                const peso = getPesoXP(s.equipe);
                const xpConversao = Math.round((s.vgv / 1000) * peso);

                html += `
                    <tr class="${rankClass}" style="${rowStyle}">
                        <td>${rankBadge}</td>
                        <td>${s.vendedor}${isCurrentUser?' ⭐':''} ${!isAtivo(s.vendedor)?'<span style="color:#e53935;font-size:0.7rem;">(INATIVO)</span>':''}</td>

                        <td><strong>${formatCurrency(s.vgv)}</strong></td>
                        <td class="vgv-ponderado">${formatXP(xpConversao)} <span style="font-size:0.65rem;color:var(--text-dim);">(×${peso})</span></td>
                        <td>${s.num_vendas}</td>
                        <td>${formatCurrency(s.ticket_medio)}</td>
                        <td>${s.dias_presente}d / ${s.dias_pontual}d</td>
                        <td class="xp-tag xp-highlight">${formatXP(s.xp_total)}</td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;

            // Rankings por equipe
            const teams = ['CAPTACAO', 'CONSULTORIA', 'CLOSER'];
            const teamNames = { 'CAPTACAO': 'Captação', 'CONSULTORIA': 'Consultoria', 'CLOSER': 'Closer' };
            const teamIcons = { 'CAPTACAO': 'fa-phone-volume', 'CONSULTORIA': 'fa-handshake', 'CLOSER': 'fa-check-double' };

            teams.forEach(team => {
                const teamSellers = ativos.filter(s => s.equipe === team);
                if (teamSellers.length === 0) return;
                html +=
                    `<div class="section-title" style="margin-top:28px;"><i class="fa-solid ${teamIcons[team]}"></i> Ranking — ${teamNames[team]}</div>`;
                html +=
                    `<div class="table-container"><table><thead><tr><th>#</th><th>Vendedor</th><th>VGV</th><th>XP Conversão</th><th>Ticket Médio</th><th>${team==='CONSULTORIA'?'Eficiência':team==='CLOSER'?'Entrada Ef.':'Casais'}</th><th>XP Total</th></tr></thead><tbody>`;
                teamSellers.forEach((s, idx) => {
                    const badges = ['<span class="rank-badge r1">1</span>',
                        '<span class="rank-badge r2">2</span>',
                        '<span class="rank-badge r3">3</span>'
                    ];
                    const rankBadge = idx < 3 ? badges[idx] :
                        `<span class="rank-badge rn">${idx+1}</span>`;

                    const rowStyle = isCurrentUser ?
                        'background:rgba(0,102,177,0.12);font-weight:600;' : '';
                    let extraVal = team === 'CONSULTORIA' ? s.eficiencia + '%' : team === 'CLOSER' ? s
                        .entrada_efetiva + '%' : s.casais;

                            <td>${formatCurrency(s.ticket_medio)}</td>

                html += `</tbody></table></div>`;

        }

        // ==================== RENDER: PRESENÇA ====================
        function renderPresenca() {
            const container = document.getElementById('presencaContent');
            if (!container) return;

            const isAdmin = currentUser && currentUser.role === 'admin';
            const targetSeller = isAdmin ? (processedSellers.length > 0 ? processedSellers[0] : null) : (currentUser
                ?.sellerData || null);

            if (!targetSeller && processedSellers.length === 0) {
                container.innerHTML =
                    '<p style="color:var(--text-dim);">Nenhum dado carregado. Aguarde o carregamento do CSV.</p>';
                return;
            }

            const selectedVendedor = isAdmin ? (document.getElementById('presencaVendedorSelect')?.value ||
                targetSeller?.vendedor) : targetSeller?.vendedor;

            const seller = processedSellers.find(s => s.vendedor === selectedVendedor) || targetSeller;
            if (!seller) {
                container.innerHTML = '<p style="color:var(--bmw-red);">Nenhum vendedor encontrado.</p>';
                return;
            }

            const presencaArr = getPresencaFor(seller.vendedor) || initPresencaFromCSV(seller);
            const diasPresentes = countDiasPresentesFromArray(presencaArr);
            const diasFalta = TOTAL_DIAS_CAMPANHA - diasPresentes;

            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            // Julho 2026 começa na quarta-feira (dia 1 = quarta)
            const inicioSemana = 3; // 0=Dom, 3=Qua

            let html = `
                <div class="section-title"><i class="fa-solid fa-calendar-check"></i> Lista de Presença — Julho 2026</div>
                ${isAdmin ? `
                <div class="presenca-selector">
                    <select id="presencaVendedorSelect" onchange="onPresencaVendedorChange()">
                        ${processedSellers.map(s => `<option value="${s.vendedor}" ${s.vendedor===seller.vendedor?'selected':''}>${s.vendedor} (${s.equipe})</option>`).join('')}
                    </select>
                </div>` : ''}
                <div class="presenca-legend">
                    <span><span class="leg-dot presente"></span> Presente</span>
                    <span><span class="leg-dot falta"></span> Falta</span>
                    <span style="color:#666;"><span class="leg-dot" style="background:#333;"></span> Não definido</span>
                </div>
                <div class="presenca-summary">
                    <div class="sum-item">
                        <div class="sum-value green">${diasPresentes}</div>
                        <div class="sum-label">Dias Presentes</div>
                    </div>
                    <div class="sum-item">
                        <div class="sum-value red">${diasFalta}</div>
                        <div class="sum-label">Faltas</div>
                    </div>
                    <div class="sum-item">
                        <div class="sum-value" style="color:var(--bmw-light);">${formatXP(diasPresentes*50000)}</div>
                        <div class="sum-label">XP Presença</div>
                    </div>
                    <div class="sum-item">
                        <div class="sum-value">${seller.dias_pontual}</div>
                        <div class="sum-label">Dias Pontuais (CSV)</div>
                    </div>
                </div>
                <div class="calendar-grid">
                    ${diasSemana.map(d => `<div class="calendar-day-header">${d}</div>`).join('')}
            `;

            // Preencher dias vazios antes do dia 1
            for (let i = 0; i < inicioSemana; i++) {
                html += `<div></div>`;
            }

            for (let dia = 1; dia <= TOTAL_DIAS_CAMPANHA; dia++) {
                const idx = dia - 1;
                const val = presencaArr[idx];
                let stateClass = 'state-undefined';
                let label = '';
                if (val === 1) { stateClass = 'state-presente';
                    label = 'P'; } else if (val === 0) { stateClass = 'state-falta';
                    label = 'F'; }
                const editable = isAdmin;
                html += `
                    <div class="calendar-day ${stateClass}"
                         ${editable ? `onclick="togglePresenca('${seller.vendedor.replace(/'/g, "\\'")}', ${idx})"` : ''}
                         title="Dia ${dia} de Julho${editable ? ' — Clique para alternar' : ''}">
                        <span class="day-num">${dia}</span>
                        <span class="day-label">${label}</span>
                    </div>`;
            }

            // Fechar grid
            const totalCelulas = inicioSemana + TOTAL_DIAS_CAMPANHA;
            const resto = totalCelulas % 7;
            if (resto > 0) {
                for (let i = 0; i < 7 - resto; i++) html += `<div></div>`;
            }

            html += `</div>`;

            if (isAdmin) {
                html += `
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
                        <button class="btn btn-outline btn-sm" onclick="marcarTodosPresenca('${seller.vendedor.replace(/'/g, "\\'")}', 1)">
                            <i class="fa-solid fa-check-double"></i> Marcar Todos Presentes
                        </button>
                        <button class="btn btn-outline btn-sm" onclick="marcarTodosPresenca('${seller.vendedor.replace(/'/g, "\\'")}', 0)">
                            <i class="fa-solid fa-xmark"></i> Marcar Todos Falta
                        </button>
                    </div>`;
            }

            if (!isAdmin) {
                html +=
                    `<p style="margin-top:12px;font-size:0.8rem;color:var(--text-dim);"><i class="fa-solid fa-info-circle"></i> A presença é gerenciada pelo administrador. Procure o admin para ajustes.</p>`;
            }

            container.innerHTML = html;
        }

        function onPresencaVendedorChange() {
            renderPresenca();
        }

        function togglePresenca(vendedor, idx) {
            if (!currentUser || currentUser.role !== 'admin') return;
            let arr = getPresencaFor(vendedor);
            if (!arr) {
                const seller = processedSellers.find(s => s.vendedor === vendedor);
                arr = seller ? initPresencaFromCSV(seller) : new Array(TOTAL_DIAS_CAMPANHA).fill(0);
            }
            // Ciclo: undefined(ou 0) → 1 → 0 → 1 ...
            if (arr[idx] === 1) arr[idx] = 0;
            else arr[idx] = 1;
            setPresencaFor(vendedor, arr);
            // Recalcular
            processedSellers = processAllSellers(rawCSVData);
            if (currentUser.role === 'vendedor' && currentUser.name === vendedor) {
                const refreshed = processedSellers.find(s => s.vendedor === vendedor);
                if (refreshed) currentUser.sellerData = refreshed;
            }
            renderPresenca();
            showToast(`Dia ${idx+1}: ${arr[idx]===1?'✅ Presente':'❌ Falta'}`, 'success');
        }

        function marcarTodosPresenca(vendedor, valor) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const arr = new Array(TOTAL_DIAS_CAMPANHA).fill(valor);
            setPresencaFor(vendedor, arr);
            processedSellers = processAllSellers(rawCSVData);
            renderPresenca();
            showToast(`Todos marcados como ${valor===1?'Presente':'Falta'}!`, 'success');
        }

        // ==================== RENDER: STATUS (ATIVO/INATIVO) ====================
        function renderStatus() {
            const container = document.getElementById('statusContent');
            if (!container || currentUser?.role !== 'admin') return;

            if (processedSellers.length === 0) {
                container.innerHTML =
                    '<p style="color:var(--text-dim);">Nenhum vendedor carregado.</p>';
                return;
            }

            let html = `
                <div class="section-title"><i class="fa-solid fa-toggle-on"></i> Controle de Ativo/Inativo</div>
                <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:16px;">
                    <i class="fa-solid fa-info-circle"></i> Vendedores <strong style="color:#e53935;">inativos</strong> não aparecem no ranking e não participam da competição.
                </p>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Vendedor</th><th>Equipe</th><th>Status</th><th>Ação</th></tr></thead>
                        <tbody>`;

            processedSellers.forEach(s => {
                const ativo = isAtivo(s.vendedor);
                html += `
                    <tr>
                        <td><strong>${s.vendedor}</strong></td>
                        <td>${s.equipe}</td>
                        <td>
                            <span class="status-toggle ${ativo?'ativo':'inativo'}" onclick="toggleAtivo('${s.vendedor.replace(/'/g, "\\'")}')">
                                <span class="status-dot"></span>
                                ${ativo?'ATIVO':'INATIVO'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm ${ativo?'btn-danger':'btn-primary'}" onclick="toggleAtivo('${s.vendedor.replace(/'/g, "\\'")}')">
                                ${ativo?'<i class="fa-solid fa-ban"></i> Desativar':'<i class="fa-solid fa-check"></i> Ativar'}
                            </button>
                        </td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function toggleAtivo(vendedor) {
            if (!currentUser || currentUser.role !== 'admin') return;
            const novo = !isAtivo(vendedor);
            setAtivoStatus(vendedor, novo);
            processedSellers = processAllSellers(rawCSVData);
            renderStatus();
            showToast(`${vendedor} ${novo?'ativado ✅':'desativado ❌'}`, 'success');
        }

                        <tbody>`;

                        <td>${s.entrada_efetiva>0?s.entrada_efetiva+'%':'-'}</td>
                        <td>${s.casais>0?s.casais:'-'}</td>
                        <td>${s.data_inicio?formatDateBR(s.data_inicio):'01/07/26'}</td>
                        <td class="xp-tag">${formatXP(s.xp_total)}</td>
                    </tr>`;
            });
            html += `</tbody></table></div></div>`;
            html += `
                <div class="section-title" style="margin-top:24px;"><i class="fa-solid fa-file-csv"></i> Preview CSV</div>
                <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow-x:auto;max-height:300px;overflow-y:auto;">
                    <pre style="font-size:0.78rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;">${generateCSVPreview()}</pre></div>`;
            container.innerHTML = html;
        }

        function generateCSVPreview() {
            if (rawCSVData.length === 0)
            return 'vendedor,equipe,vgv,num_vendas,dias_presente,dias_pontual,meetings,eficiencia,entrada_efetiva,casais,data_inicio,senha\n';
            const headers = Object.keys(rawCSVData[0]).join(',');
            return headers + '\n' + rawCSVData.map(r => Object.values(r).join(',')).join('\n');
        }

        function downloadSampleCSV() {
            const sample =
                `vendedor,equipe,vgv,num_vendas,dias_presente,dias_pontual,meetings,eficiencia,entrada_efetiva,casais,data_inicio,senha
        João Silva,CAPTACAO,5200000,18,22,20,5,,,38,,joao123
        Maria Santos,CONSULTORIA,4100000,14,21,19,4,35,,,,maria123
        Pedro Costa,CLOSER,3800000,12,20,18,3,,5,,2026-07-05,pedro123
        Ana Oliveira,CAPTACAO,6100000,22,22,21,6,,,45,,ana123
        Lucas Mendes,CONSULTORIA,3500000,11,20,17,2,28,,,,lucas123
        Carla Rocha,CLOSER,4500000,15,22,22,4,,7,,,carla123`;
            const blob = new Blob([sample], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dados.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Modelo CSV baixado!', 'success');
        }

        function buildRegrasCard(team, icon, color, rules) {
            const names = { 'CONSULTORIA': 'Consultoria', 'CLOSER': 'Closer', 'CAPTACAO': 'Captação' };
            return `<div class="regras-card" style="border-top:3px solid ${color};">
                <h3 style="color:${color};"><i class="fa-solid ${icon}"></i> ${names[team]}</h3>
                <ul>${rules.map(r=>`<li>• ${r}</li>`).join('')}</ul></div>`;
        }

        // ==================== RENDER ALL ====================
        function renderAll() {
            renderMeusNumeros();
            renderRanking();
            renderPresenca();
            renderStatus();
            renderAdmin();
            renderRegras();
        }

        // ==================== TOAST ====================
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300); }, 3000);
        }
    </script>
