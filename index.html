<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏁 BMW Champions League - Dashboard 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root {
  --bg: #0a0a0a; --surface: #141414; --card: #1a1a1a;
  --border: #2a2a2a; --bmw-blue: #0066B1; --bmw-light: #1E93E1;
  --bmw-red: #E30613; --text: #e0e0e0; --text-dim: #999;
  --text-bright: #fff; --gold: #f0c040; --silver: #b0b0b0;
  --bronze: #cd7f32; --green: #00c853; --radius: 14px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url('https://images.unsplash.com/photo-1617531653332-bad972bddd65?w=1400&q=80');
  background-size:cover;background-position:center 30%;
  opacity:0.04;z-index:0;pointer-events:none;
}
/* LOGIN */
#loginOverlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:10000;
}
.login-box{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:40px;width:90%;max-width:420px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.bmw-stripes{display:flex;justify-content:center;gap:4px;margin-bottom:20px;}
.bmw-stripe{width:40px;height:6px;border-radius:3px;}
.bmw-stripe:nth-child(1){background:var(--bmw-blue);}
.bmw-stripe:nth-child(2){background:var(--bmw-light);}
.bmw-stripe:nth-child(3){background:var(--bmw-red);}
.login-logo{font-size:3rem;margin-bottom:8px;}
.login-title{font-size:1.4rem;font-weight:800;color:var(--text-bright);letter-spacing:1px;}
.login-subtitle{font-size:0.85rem;color:var(--text-dim);margin-bottom:24px;}
.input-group{
  display:flex;align-items:center;background:#222;border:1px solid #333;
  border-radius:10px;padding:10px 14px;margin-bottom:10px;gap:10px;
}
.input-group i{color:var(--text-dim);font-size:0.9rem;}
.input-group input{
  background:transparent;border:none;outline:none;color:var(--text);
  font-size:0.95rem;width:100%;
}
.login-btn{
  width:100%;padding:12px;margin-top:8px;
  background:var(--bmw-blue);color:#fff;border:none;border-radius:10px;
  font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition);
}
.login-btn:hover{background:var(--bmw-light);}
.login-error{color:var(--bmw-red);font-size:0.8rem;margin-top:8px;min-height:20px;}

/* HEADER */
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.header-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;}
.header-brand .icon{font-size:1.5rem;}
.header-brand .title-text{color:var(--bmw-light);}
.header-brand .champions{color:var(--text-dim);font-size:0.75rem;letter-spacing:2px;}
.header-user{display:flex;align-items:center;gap:12px;}
.user-badge{display:flex;align-items:center;gap:6px;font-size:0.85rem;}
.user-badge i{color:var(--bmw-light);}
.role{font-size:0.65rem;background:var(--bmw-blue);color:#fff;padding:2px 8px;border-radius:50px;}
.logout-btn{
  background:transparent;border:1px solid #444;color:var(--text-dim);
  padding:6px 14px;border-radius:50px;cursor:pointer;font-size:0.75rem;transition:var(--transition);
}
.logout-btn:hover{color:#fff;border-color:#888;}

/* TABS */
.tab-nav{
  display:flex;gap:2px;padding:8px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap;
  position:sticky;top:58px;z-index:99;
}
.tab-btn{
  padding:8px 16px;border:none;background:transparent;color:var(--text-dim);
  font-size:0.78rem;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;
  transition:var(--transition);white-space:nowrap;
}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,0.03);}
.tab-btn.active{color:#fff;background:var(--card);border-bottom:2px solid var(--bmw-blue);}

/* CONTENT */
.main-content{padding:20px 24px;position:relative;z-index:1;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;color:var(--text-bright);}

/* CALENDAR */
.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;
}
.calendar-day-header{
  text-align:center;font-size:0.7rem;font-weight:700;color:var(--text-dim);
  padding:6px 0;text-transform:uppercase;
}
.calendar-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;cursor:pointer;transition:0.2s;
  font-weight:700;font-size:0.85rem;user-select:none;
  background:rgba(255,255,255,0.03);position:relative;
}
.calendar-day:hover{transform:scale(1.08);border:1px solid #ccc;z-index:2;}
.day-presente{background:#00c853;color:#fff;}
.day-falta{background:#e53935;color:#fff;}
.day-misto{background:#ff9800;color:#fff;}
.day-undefined{background:#2a2a2a;color:#666;}
.day-future{background:#1a1a1a;color:#444;cursor:default;}
.day-future:hover{transform:none;border:none;}
.day-meeting-dot{
  position:absolute;top:3px;right:4px;width:7px;height:7px;
  background:#ff0;border-radius:50%;
}

/* MONTH SELECTOR */
.month-selector{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;
}
.month-selector select{
  background:#222;color:#fff;border:1px solid #444;padding:8px 14px;
  border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;
}
.month-selector label{color:var(--text-dim);font-size:0.85rem;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 0.3s;z-index:9998;
}
.modal-overlay.active{opacity:1;visibility:visible;}
.modal-box{
  background:#1e1e1e;border-radius:20px;max-height:92vh;overflow-y:auto;
  width:95vw;max-width:960px;box-shadow:0 25px 80px rgba(0,0,0,0.9);
  transform:translateY(20px);transition:transform 0.3s;
}
.modal-overlay.active .modal-box{transform:translateY(0);}
.modal-header{
  padding:20px 24px;border-bottom:1px solid #333;
  position:sticky;top:0;background:#1e1e1e;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
}
.modal-title{font-size:1.15rem;font-weight:700;color:#eee;}
.modal-subtitle{font-size:0.8rem;color:#999;margin-top:2px;}
.modal-close{
  background:none;border:none;font-size:1.3rem;color:#999;cursor:pointer;transition:0.2s;
}
.modal-close:hover{color:#fff;}
.modal-body{padding:20px 24px;}
.modal-footer{
  padding:16px 24px;border-top:1px solid #333;display:flex;gap:8px;
  flex-wrap:wrap;position:sticky;bottom:0;background:#1e1e1e;
}

/* TEAM SECTIONS */
.team-section{margin-bottom:20px;}
.team-header{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-radius:8px;margin-bottom:6px;font-weight:700;font-size:0.9rem;
}
.captacao{background:rgba(139,108,173,0.18);border-left:3px solid #8B6CAD;color:#b39ddb;}
.consultoria{background:rgba(30,147,225,0.18);border-left:3px solid #1E93E1;color:#64b5f6;}
.closer{background:rgba(227,6,19,0.18);border-left:3px solid #E30613;color:#ef9a9a;}

.seller-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:#252525;border-radius:6px;margin-bottom:4px;
  transition:0.2s;flex-wrap:wrap;gap:8px;
}
.seller-row:hover{background:#303030;}
.seller-name{font-weight:600;font-size:0.88rem;min-width:130px;}
.seller-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.meeting-group{display:flex;align-items:center;gap:4px;}
.meeting-group input[type="text"]{
  background:#1a1a1a;border:1px solid #444;color:#fff;padding:4px 8px;
  border-radius:6px;font-size:0.75rem;width:140px;
}
.meeting-group input[type="text"]:focus{outline:none;border-color:var(--bmw-light);}

/* BUTTONS */
.btn{
  padding:8px 16px;border-radius:50px;font-weight:700;font-size:0.78rem;
  cursor:pointer;border:none;transition:0.2s;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--bmw-blue);color:#fff;}
.btn-primary:hover{background:var(--bmw-light);}
.btn-secondary{background:#444;color:#fff;}
.btn-secondary:hover{background:#555;}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:#e53935;color:#fff;}
.toggle-btn{
  padding:5px 12px;border-radius:50px;border:none;cursor:pointer;
  font-weight:700;font-size:0.75rem;transition:0.2s;
}
.toggle-presente{background:#00c853;color:#fff;}
.toggle-falta{background:#e53935;color:#fff;}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #222;}
th{background:#1a1a1a;color:var(--text-dim);font-weight:700;font-size:0.75rem;text-transform:uppercase;}
tr:hover{background:rgba(255,255,255,0.02);}

/* TOAST */
#toastContainer{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:6px;}
.toast{
  padding:12px 20px;border-radius:10px;font-size:0.85rem;font-weight:600;
  color:#fff;opacity:1;transition:opacity 0.3s;min-width:250px;
}
.toast.success{background:#00c853;}
.toast.error{background:#e53935;}

/* ADMIN */
.admin-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.admin-controls input{
  background:#1a1a1a;border:1px solid #444;color:#fff;
  padding:8px 14px;border-radius:8px;font-size:0.85rem;flex:1;min-width:300px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .header{padding:10px 14px;font-size:0.85rem;}
  .tab-btn{padding:6px 10px;font-size:0.7rem;}
  .main-content{padding:14px;}
  .seller-row{flex-direction:column;align-items:flex-start;}
  .modal-box{width:96vw;max-height:85vh;}
  .calendar-day{font-size:0.7rem;}
  .meeting-group input[type="text"]{width:100px;}
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="bmw-stripes">
      <div class="bmw-stripe"></div><div class="bmw-stripe"></div><div class="bmw-stripe"></div>
    </div>
    <div class="login-logo">🏁</div>
    <div class="login-title">BMW CHAMPIONS LEAGUE</div>
    <div class="login-subtitle">Temporada 2026 • Julho a Dezembro</div>
    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off"/>
    </div>
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="loginPass" placeholder="Senha"/>
    </div>
    <button class="login-btn" onclick="doLogin()"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ==================== DASHBOARD ==================== -->
<div id="dashboard" style="display:none;">
  <header class="header">
    <div class="header-brand">
      <span class="icon">🏁</span>
      <span class="title-text">BMW</span>
      <span class="champions">Champions League</span>
    </div>
    <div class="header-user">
      <div class="user-badge">
        <i class="fa-solid fa-circle-user"></i>
        <span id="headerUserName">Admin</span>
        <span class="role" id="headerUserRole">ADMIN</span>
      </div>
      <button class="logout-btn" onclick="doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
    </div>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="meus-numeros"><i class="fa-solid fa-gauge-high"></i> Meus Números</button>
    <button class="tab-btn" data-tab="ranking"><i class="fa-solid fa-trophy"></i> Ranking Geral</button>
    <button class="tab-btn" data-tab="presenca"><i class="fa-solid fa-calendar-check"></i> Lista de Presença</button>
    <button class="tab-btn admin-only" data-tab="status" style="display:none;"><i class="fa-solid fa-toggle-on"></i> Ativo/Inativo</button>
    <button class="tab-btn admin-only" data-tab="admin" style="display:none;"><i class="fa-solid fa-gear"></i> Admin</button>
    <button class="tab-btn" data-tab="regras"><i class="fa-solid fa-book"></i> Regras</button>
  </nav>

  <div class="main-content">
    <div class="tab-panel active" id="panel-meus-numeros"><div id="meusNumerosContent"></div></div>
    <div class="tab-panel" id="panel-ranking"><div id="rankingContent"></div></div>
    <div class="tab-panel" id="panel-presenca"><div id="presencaContent"></div></div>
    <div class="tab-panel" id="panel-status"><div id="statusContent"></div></div>
    <div class="tab-panel" id="panel-admin">
      <div class="section-title"><i class="fa-solid fa-gear"></i> Painel do Administrador</div>
      <div class="admin-controls">
        <input type="text" id="csvUrlInput" placeholder="URL do dados.csv no GitHub"/>
        <button class="btn btn-primary" onclick="reloadCSV()"><i class="fa-solid fa-rotate"></i> Recarregar Dados</button>
      </div>
      <div id="adminDataTable" style="margin-top:16px;"></div>
    </div>
    <div class="tab-panel" id="panel-regras"><div id="regrasContent"></div></div>
  </div>
</div>

<!-- ==================== MODAL PRESENÇA ==================== -->
<div class="modal-overlay" id="presencaModal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-title"><i class="fa-solid fa-calendar-day"></i> Dia <span id="modalDiaLabel">1</span></div>
        <div class="modal-subtitle" id="modalSubtitle">Julho 2026</div>
      </div>
      <button class="modal-close" onclick="closePresencaModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-success" onclick="marcarTodosModal(1)"><i class="fa-solid fa-check"></i> Todos Presentes</button>
      <button class="btn btn-danger" onclick="marcarTodosModal(0)"><i class="fa-solid fa-xmark"></i> Todos Faltaram</button>
      <button class="btn btn-primary" onclick="salvarPresenca()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ==================== CONFIGURAÇÃO ====================
const DEFAULT_CSV_URL = '';
const TOTAL_DIAS_MES = [31,31,30,31,30,31]; // Jul, Ago, Set, Out, Nov, Dez 2026
const MESES = ['Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_KEY = ['07','08','09','10','11','12'];
const PESO_XP = {'CAPTACAO':1200,'CONSULTORIA':1100,'CLOSER':1000};
const XP_PRESENCA_DIA = 50000;
const XP_MEETING = 200000;

// ==================== ESTADO GLOBAL ====================
let csvUrl = DEFAULT_CSV_URL;
let currentUser = null;
let rawCSV = [];
let professionals = [];  // Array de {nome, equipe, vgv, vendas, vendas_total, ativo}
let mesSelecionado = 0; // 0=Julho

// ==================== INICIALIZAÇÃO ====================
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick=()=>switchTab(b.dataset.tab);
  });
  const savedUrl = localStorage.getItem('csvUrl2026');
  if(savedUrl){ csvUrl=savedUrl; document.getElementById('csvUrlInput').value=savedUrl; }
  if(csvUrl) loadCSV();
});

// ==================== LOGIN ====================
function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value.trim();
  document.getElementById('loginError').textContent='';

  if(u==='admin' && p==='admin123'){
    currentUser = {name:'Administrador',role:'admin'};
    showDashboard();
    return;
  }

  const prof = professionals.find(s=>s.nome.toLowerCase()===u && s.senha===p);
  if(prof){
    currentUser = {name:prof.nome,role:'vendedor',team:prof.equipe,prof:prof};
    showDashboard();
  } else {
    document.getElementById('loginError').textContent='Usuário ou senha inválidos';
  }
}

function showDashboard(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('dashboard').style.display='block';
  updateHeader();
  switchTab('meus-numeros');
}

function doLogout(){
  currentUser=null;
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('dashboard').style.display='none';
}

function updateHeader(){
  document.getElementById('headerUserName').textContent=currentUser?.name||'';
  document.getElementById('headerUserRole').textContent=currentUser?.role==='admin'?'ADMIN':'VENDEDOR';
  const adminEls = document.querySelectorAll('.admin-only');
  adminEls.forEach(el=>el.style.display=currentUser?.role==='admin'?'':'none');
}

// ==================== TABS ====================
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('panel-'+tab);
  const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if(panel) panel.classList.add('active');
  if(btn) btn.classList.add('active');

  if(tab==='meus-numeros') renderMeusNumeros();
  if(tab==='ranking') renderRanking();
  if(tab==='presenca') renderPresenca();
  if(tab==='status') renderStatus();
  if(tab==='admin') renderAdmin();
  if(tab==='regras') renderRegras();
}

// ==================== CSV: CARREGAR & PROCESSAR ====================
async function loadCSV(){
  try{
    if(!csvUrl){ showToast('Configure a URL do CSV no painel Admin','error'); return; }
    const resp = await fetch(csvUrl);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const txt = await resp.text();
    rawCSV = parseCSV(txt);
    professionals = extractProfessionals(rawCSV);
    localStorage.setItem('csvUrl2026',csvUrl);
    document.getElementById('csvUrlInput').value=csvUrl;
    showToast(`${professionals.length} profissionais carregados!`,'success');
    renderAll();
  }catch(e){
    showToast(`Erro ao carregar CSV: ${e.message}`,'error');
  }
}

function reloadCSV(){
  csvUrl = document.getElementById('csvUrlInput').value.trim();
  if(!csvUrl){ showToast('Informe a URL do CSV','error'); return; }
  localStorage.setItem('csvUrl2026',csvUrl);
  loadCSV();
}

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  if(lines.length<2) return [];
  const headers = parseCSVLine(lines[0]).map(h=>h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  const data = [];
  for(let i=1;i<lines.length;i++){
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h,j)=>obj[h]=vals[j]||'');
    data.push(obj);
  }
  return data;
}

function parseCSVLine(line){
  const result = [];
  let current = '';
  let inQuotes = false;
  for(let char of line){
    if(char==='"'){ inQuotes=!inQuotes; }
    else if(char===',' && !inQuotes){ result.push(current.trim()); current=''; }
    else { current+=char; }
  }
  result.push(current.trim());
  return result;
}

function findColumn(headers, keywords){
  for(let kw of keywords){
    for(let h of Object.keys(headers)){
      if(h.includes(kw)) return h;
    }
  }
  return null;
}

function extractProfessionals(raw){
  if(raw.length===0) return [];

  const firstRow = raw[0];
  // Detecta colunas
  const colCaptador = findColumn(firstRow, ['captador','captacao','promotor','capta']);
  const colConsultor = findColumn(firstRow, ['consultor','consultoria','consult']);
  const colCloser = findColumn(firstRow, ['closer','fechador','close']);
  const colVGV = findColumn(firstRow, ['vgv','valor']);
  const colStatus = findColumn(firstRow, ['status','contrato']);
  const colSenha = findColumn(firstRow, ['senha','password']);

  console.log('Colunas detectadas:',{colCaptador,colConsultor,colCloser,colVGV,colStatus,colSenha});

  // Mapa: nome -> {equipe, vgv, vendas, vendas_total}
  const map = {};

  for(let row of raw){
    const statusRaw = (row[colStatus]||'').trim();
    const {active,total} = parseStatus(statusRaw);
    if(active===0 && total===0) continue; // sem venda

    const vgvRaw = parseFloat((row[colVGV]||'0').replace(/[^0-9,.-]/g,'').replace(',','.'))||0;
    const vgvEff = total>0 ? vgvRaw*(active/total) : 0;

    const nomes = [];
    if(colCaptador && row[colCaptador]?.trim()) nomes.push({nome:row[colCaptador].trim(),equipe:'CAPTACAO'});
    if(colConsultor && row[colConsultor]?.trim()) nomes.push({nome:row[colConsultor].trim(),equipe:'CONSULTORIA'});
    if(colCloser && row[colCloser]?.trim()) nomes.push({nome:row[colCloser].trim(),equipe:'CLOSER'});

    for(let {nome,equipe} of nomes){
      if(!map[nome]){
        map[nome] = {equipe,vgv:0,vendas:0,vendas_total:0};
      }
      map[nome].vgv += vgvEff;
      map[nome].vendas += active;
      map[nome].vendas_total += total;
    }
  }

  // Converte para array
  const list = [];
  for(let nome in map){
    const d = map[nome];
    // Senha: padrão = nome em minúsculo sem espaços, ou do CSV se existir
    let senha = nome.toLowerCase().replace(/\s/g,'').substring(0,10);
    // Tenta achar senha no CSV
    if(colSenha){
      for(let row of raw){
        if((row[colCaptador]||'').trim()===nome || (row[colConsultor]||'').trim()===nome || (row[colCloser]||'').trim()===nome){
          if(row[colSenha]?.trim()){ senha=row[colSenha].trim(); break; }
        }
      }
    }
    list.push({
      nome,
      equipe: d.equipe,
      vgv: d.vgv,
      vendas: d.vendas,
      vendas_total: d.vendas_total,
      senha,
      ativo: getAtivoStatus(nome)
    });
  }

  return list;
}

function parseStatus(statusRaw){
  if(!statusRaw) return {active:0,total:0};
  const partes = statusRaw.split('#').map(s=>s.trim().toUpperCase());
  let active=0, total=partes.length;
  for(let p of partes){
    if(p==='ATIVO') active++;
  }
  return {active,total};
}

// ==================== XP CALC ====================
function calcTotalXP(prof){
  let xp = 0;
  // XP de VGV
  const peso = PESO_XP[prof.equipe]||1000;
  xp += (prof.vgv/1000)*peso;
  // XP de presença (todos os meses)
  for(let m=0;m<6;m++){
    const diasNoMes = TOTAL_DIAS_MES[m];
    for(let d=1;d<=diasNoMes;d++){
      const dayData = getDayData(m,d);
      if(dayData[prof.nome]===1) xp += XP_PRESENCA_DIA;
    }
  }
  // XP de meeting (todos os meses)
  for(let m=0;m<6;m++){
    const diasNoMes = TOTAL_DIAS_MES[m];
    for(let d=1;d<=diasNoMes;d++){
      const mtData = getMeetingData(m,d);
      if(mtData[prof.nome]) xp += XP_MEETING;
    }
  }
  return Math.round(xp);
}

function countPresencasTotal(prof){
  let count=0;
  for(let m=0;m<6;m++){
    const diasNoMes = TOTAL_DIAS_MES[m];
    for(let d=1;d<=diasNoMes;d++){
      const dayData = getDayData(m,d);
      if(dayData[prof.nome]===1) count++;
    }
  }
  return count;
}

function countMeetingsTotal(prof){
  let count=0;
  for(let m=0;m<6;m++){
    const diasNoMes = TOTAL_DIAS_MES[m];
    for(let d=1;d<=diasNoMes;d++){
      const mtData = getMeetingData(m,d);
      if(mtData[prof.nome]) count++;
    }
  }
  return count;
}

function renderPresenca(){
  const el = document.getElementById('presencaContent');
  if(!el||!professionals.length){ el.innerHTML='<p>Carregue os dados primeiro.</p>';return; }

  const ativos = professionals.filter(p=>p.ativo);
  const diasNoMes = TOTAL_DIAS_MES[mesSelecionado];

  // Estatísticas do mês
  let pres=0, falt=0, meet=0;
  for(let d=1;d<=diasNoMes;d++){
    const dayData = getDayData(mesSelecionado,d);
    const mtData = getMeetingData(mesSelecionado,d);
    ativos.forEach(p=>{
      if(dayData[p.nome]===1) pres++;
      if(dayData[p.nome]===0) falt++;
      if(mtData[p.nome]) meet++;
    });
  }

  let html = `
    <div class="section-title"><i class="fa-solid fa-calendar-check"></i> Lista de Presença</div>
    <div class="month-selector">
      <label><i class="fa-solid fa-calendar"></i> Mês:</label>
      <select id="mesSelector" onchange="changeMes(this.value)">
        ${MESES.map((m,i)=>`<option value="${i}" ${i===mesSelecionado?'selected':''}>${m} 2026</option>`).join('')}
      </select>
      <span style="font-size:0.8rem;color:var(--text-dim);margin-left:8px;">
        ${ativos.length} ativos | ✅ ${pres} presenças | ❌ ${falt} faltas | 🎤 ${meet} meetings
      </span>
    </div>
  `;

  // Calendário
  const semana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  // 1/jul/2026 = quarta-feira (dia 3 da semana: 0=dom)
  const offsets = [3,5,1,3,0,2]; // primeiro dia do mês na semana
  const inicioSemana = offsets[mesSelecionado];

  html += `<div class="calendar-grid">`;
  semana.forEach(d=>html+=`<div class="calendar-day-header">${d}</div>`);
  for(let i=0;i<inicioSemana;i++) html+=`<div></div>`;

  const hoje = new Date();
  const hojeDia = hoje.getDate();
  const hojeMes = hoje.getMonth()+1;

  for(let d=1;d<=diasNoMes;d++){
    const dayData = getDayData(mesSelecionado,d);
    const mtData = getMeetingData(mesSelecionado,d);

    // Verifica se é futuro
    const mesNum = parseInt(MESES_KEY[mesSelecionado]);
    const isFuture = (mesNum > hojeMes) || (mesNum === hojeMes && d > hojeDia);

    let classDay = isFuture ? 'day-future' : 'day-undefined';
    let label = isFuture ? '' : '—';
    let hasMeeting = false;

    if(!isFuture && Object.keys(dayData).length>0){
      let pCount=0,fCount=0;
      ativos.forEach(p=>{
        if(dayData[p.nome]===1) pCount++;
        if(dayData[p.nome]===0) fCount++;
        if(mtData[p.nome]) hasMeeting=true;
      });
      if(pCount>0&&fCount===0){ classDay='day-presente'; label='P'; }
      else if(pCount===0&&fCount>0){ classDay='day-falta'; label='F'; }
      else if(pCount>0&&fCount>0){ classDay='day-misto'; label='M'; }
    }

    const clickable = currentUser?.role==='admin' && !isFuture;
    html += `<div class="calendar-day ${classDay}" ${clickable?`onclick="openPresencaModal(${d})"`:''} title="Dia ${d}">
      ${d}<br/><small>${label}</small>
      ${hasMeeting?'<div class="day-meeting-dot"></div>':''}
    </div>`;
  }
  html += `</div>`;

  // Legenda
  html += `
    <div style="margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;font-size:0.75rem;color:var(--text-dim);">
      <span>🟢 Todos presentes</span><span>🔴 Todos faltaram</span>
      <span>🟠 Misto</span><span>⚫ Não definido</span>
      <span>🟡 Bolinha = teve meeting</span>
      <span>🔒 Dias futuros bloqueados</span>
    </div>
    <p style="margin-top:8px;font-size:0.8rem;color:var(--text-dim);">
      💡 <b>Admin:</b> clique no dia para abrir a lista de presença e meetings.
    </p>
  `;

  el.innerHTML = html;
}

let modalDia = 1;
let modalPresenca = {}; // nome -> 1|0
let modalMeeting = {};  // nome -> tema ou null

function openPresencaModal(dia){
  modalDia = dia;
  const ativos = professionals.filter(p=>p.ativo);

  // Carrega dados salvos
  const savedPresenca = getDayData(mesSelecionado,dia);
  const savedMeeting = getMeetingData(mesSelecionado,dia);

  modalPresenca = {};
  modalMeeting = {};
  ativos.forEach(p=>{
    modalPresenca[p.nome] = savedPresenca[p.nome]!==undefined ? savedPresenca[p.nome] : 1;
    modalMeeting[p.nome] = savedMeeting[p.nome] || null;
  });

  document.getElementById('modalDiaLabel').textContent = dia;
  document.getElementById('modalSubtitle').textContent = `${MESES[mesSelecionado]} 2026 • Clique para marcar falta e/ou meeting`;

  renderModalBody();

  document.getElementById('presencaModal').classList.add('active');
  document.body.style.overflow='hidden';
}

function renderModalBody(){
  const ativos = professionals.filter(p=>p.ativo);
  const equipes = {captacao:[],consultoria:[],closer:[]};

  ativos.forEach(p=>{
    if(p.equipe==='CAPTACAO') equipes.captacao.push(p);
    else if(p.equipe==='CONSULTORIA') equipes.consultoria.push(p);
    else equipes.closer.push(p);
  });

  let html = '';
  const grupos = [
    {key:'captacao',label:'Captação',cls:'captacao',icon:'fa-phone-volume',list:equipes.captacao},
    {key:'consultoria',label:'Consultoria',cls:'consultoria',icon:'fa-handshake',list:equipes.consultoria},
    {key:'closer',label:'Closer',cls:'closer',icon:'fa-check-double',list:equipes.closer}
  ];

  grupos.forEach(g=>{
    if(!g.list.length) return;
    html += `<div class="team-section">`;
    html += `<div class="team-header ${g.cls}"><i class="fa-solid ${g.icon}"></i> ${g.label} (${g.list.length})</div>`;

    g.list.forEach(p=>{
      const presente = modalPresenca[p.nome]===1;
      const tema = modalMeeting[p.nome]||'';
      const hasMeeting = !!modalMeeting[p.nome];

      html += `
        <div class="seller-row" id="row-${escId(p.nome)}">
          <div class="seller-name">${p.nome}</div>
          <div class="seller-controls">
            <button class="toggle-btn ${presente?'toggle-presente':'toggle-falta'}"
              onclick="togglePresencaModal('${escJS(p.nome)}')">
              <i class="fa-solid ${presente?'fa-check':'fa-xmark'}"></i> ${presente?'Presente':'Faltou'}
            </button>
            <div class="meeting-group">
              <label style="font-size:0.7rem;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="checkbox" ${hasMeeting?'checked':''}
                  onchange="toggleMeetingModal('${escJS(p.nome)}',this.checked)"
                  style="accent-color:#ff9800;"/>
                🎤 Meeting
              </label>
              <input type="text" placeholder="Tema do meeting..."
                value="${escHTML(tema)}"
                onchange="setMeetingTopic('${escJS(p.nome)}',this.value)"
                style="${hasMeeting?'':'opacity:0.4;'}"/>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('modalBody').innerHTML = html;
}

function escId(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }
function escJS(s){ return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function togglePresencaModal(nome){
  modalPresenca[nome] = modalPresenca[nome]===1?0:1;
  renderModalBody();
}

function toggleMeetingModal(nome,checked){
  if(checked){
    modalMeeting[nome] = modalMeeting[nome]||'';
  } else {
    modalMeeting[nome] = null;
  }
  renderModalBody();
}

function setMeetingTopic(nome,valor){
  if(valor.trim()){
    modalMeeting[nome] = valor.trim();
  } else {
    modalMeeting[nome] = null;
  }
}

function marcarTodosModal(val){
  for(let nome in modalPresenca){
    modalPresenca[nome] = val;
  }
  renderModalBody();
}

function salvarPresenca(){
  setDayData(mesSelecionado,modalDia,modalPresenca);

  renderAll();

    html += `<tr>
      <td>${p.nome}</td><td>${p.equipe}</td>
      <td><span style="color:${ativo?'#00c853':'#e53935'};font-weight:700;">${ativo?'ATIVO':'INATIVO'}</span></td>
      <td><button class="btn ${ativo?'btn-danger':'btn-success'}" onclick="toggleAtivo('${escJS(p.nome)}')">
        ${ativo?'<i class="fa-solid fa-toggle-off"></i> Desativar':'<i class="fa-solid fa-toggle-on"></i> Ativar'}
      </button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}

function toggleAtivo(nome){
  const p = professionals.find(x=>x.nome===nome);
  if(!p) return;
  p.ativo = !p.ativo;
  setAtivoStatus(nome,p.ativo);
  renderStatus();
  renderAll();
  showToast(`${nome}: ${p.ativo?'ATIVADO':'DESATIVADO'}`);
}

// ==================== RENDER: ADMIN ====================
function renderAdmin(){
  const el = document.getElementById('adminDataTable');
  if(!el) return;
  if(currentUser?.role!=='admin'){ el.innerHTML='<p>Acesso restrito.</p>';return; }

  if(!professionals.length){
    el.innerHTML = '<p style="color:var(--text-dim);">Nenhum dado carregado. Informe a URL do CSV e clique em Recarregar.</p>';
    return;
  }

  document.getElementById('csvUrlInput').value = csvUrl;

  let html = `<p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:10px;">
    ${professionals.length} profissionais extraídos • ${rawCSV.length} linhas no CSV</p>`;
  html += `<table><thead><tr><th>Profissional</th><th>Equipe</th><th>VGV Líquido</th><th>Vendas Líquidas</th><th>Vendas Total</th><th>Senha</th></tr></thead><tbody>`;
  [...professionals].sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p=>{
    html += `<tr>
      <td>${p.nome}</td><td>${p.equipe}</td>
      <td>${formatCurrency(p.vgv)}</td><td>${p.vendas}</td><td>${p.vendas_total}</td>
      <td><code>${p.senha}</code></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}

// ==================== UTILITÁRIOS ====================
function renderAll(){
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab==='meus-numeros') renderMeusNumeros();
  if(activeTab==='ranking') renderRanking();
  if(activeTab==='presenca') renderPresenca();
  if(activeTab==='status') renderStatus();
  if(activeTab==='admin') renderAdmin();
}

function formatCurrency(val){
  if(!val||isNaN(val)) return 'R$ 0';
  return 'R$ '+val.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function formatXP(val){
  if(!val||isNaN(val)) return '0 XP';
  return val.toLocaleString('pt-BR')+' XP';
}

function showToast(msg,tipo='success'){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast '+(tipo==='success'?'success':'error');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); },3500);
}
</script>
