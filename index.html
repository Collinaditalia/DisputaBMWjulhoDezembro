<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏁 BMW Champions League 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root {
  --bg: #0a0a0a; --surface: #141414; --card: #1a1a1a;
  --border: #2a2a2a; --bmw-blue: #0066B1; --bmw-light: #1E93E1;
  --bmw-red: #E30613; --text: #e0e0e0; --text-dim: #999;
  --text-bright: #fff; --gold: #f0c040; --green: #00c853;
  --radius: 12px; --transition: 0.25s;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI','Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;
  background:url('https://images.unsplash.com/photo-1617531653332-bad972bddd65?w=1400&q=80') center 30%/cover;
  opacity:0.04;z-index:0;pointer-events:none;
}

#loginOverlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:10000;
}
.login-box{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:40px;width:90%;max-width:420px;text-align:center;
}
.bmw-stripes{display:flex;justify-content:center;gap:4px;margin-bottom:20px;}
.bmw-stripe{width:40px;height:6px;border-radius:3px;}
.bmw-stripe:nth-child(1){background:var(--bmw-blue)}
.bmw-stripe:nth-child(2){background:var(--bmw-light)}
.bmw-stripe:nth-child(3){background:var(--bmw-red)}
.login-logo{font-size:3rem;margin-bottom:8px}
.login-title{font-size:1.4rem;font-weight:800;color:var(--text-bright)}
.login-subtitle{font-size:0.85rem;color:var(--text-dim);margin-bottom:24px}
.input-group{display:flex;align-items:center;background:#222;border:1px solid #333;border-radius:10px;padding:10px 14px;margin-bottom:10px;gap:10px}
.input-group i{color:var(--text-dim);font-size:0.9rem}
.input-group input{background:transparent;border:none;outline:none;color:var(--text);font-size:0.95rem;width:100%}
.login-btn{width:100%;padding:12px;margin-top:8px;background:var(--bmw-blue);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition)}
.login-btn:hover{background:var(--bmw-light)}
.login-error{color:var(--bmw-red);font-size:0.8rem;margin-top:8px;min-height:20px}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #333;border-top-color:var(--bmw-light);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingMsg{text-align:center;padding:40px;color:var(--text-dim);font-size:0.9rem;}

.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.header-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem}
.header-brand .icon{font-size:1.5rem}
.header-brand .title-text{color:var(--bmw-light)}
.header-brand .champions{color:var(--text-dim);font-size:0.75rem;letter-spacing:2px}
.header-user{display:flex;align-items:center;gap:12px}
.user-badge{display:flex;align-items:center;gap:6px;font-size:0.85rem}
.user-badge i{color:var(--bmw-light)}
.role{font-size:0.65rem;background:var(--bmw-blue);color:#fff;padding:2px 8px;border-radius:50px}
.logout-btn{background:transparent;border:1px solid #444;color:var(--text-dim);padding:6px 14px;border-radius:50px;cursor:pointer;font-size:0.75rem;transition:var(--transition)}
.logout-btn:hover{color:#fff;border-color:#888}

.tab-nav{
  display:flex;gap:2px;padding:8px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap;
  position:sticky;top:58px;z-index:99;
}
.tab-btn{padding:8px 16px;border:none;background:transparent;color:var(--text-dim);font-size:0.78rem;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;transition:var(--transition);white-space:nowrap}
.tab-btn:hover{color:#fff}
.tab-btn.active{color:#fff;background:var(--card);border-bottom:2px solid var(--bmw-blue)}

.main-content{padding:20px 24px;position:relative;z-index:1}
.tab-panel{display:none}
.tab-panel.active{display:block}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;color:var(--text-bright)}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.calendar-day-header{text-align:center;font-size:0.7rem;font-weight:700;color:var(--text-dim);padding:6px 0;text-transform:uppercase}
.calendar-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;cursor:pointer;transition:0.2s;
  font-weight:700;font-size:0.85rem;user-select:none;
  background:rgba(255,255,255,0.03);position:relative;
}
.calendar-day:hover:not(.day-future){transform:scale(1.08);z-index:2;box-shadow:0 4px 15px rgba(0,102,177,0.3)}
.day-todos-presentes{background:rgba(0,200,83,0.25);border:2px solid #00c853;color:#00c853}
.day-todos-falta{background:rgba(229,57,53,0.25);border:2px solid #e53935;color:#e53935}
.day-parcial{background:rgba(255,152,0,0.25);border:2px solid #ff9800;color:#ff9800}
.day-undefined{background:rgba(255,255,255,0.03);border:2px solid #333;color:#666}
.day-future{background:#1a1a1a;color:#444;cursor:default}
.day-meeting-dot{position:absolute;top:3px;right:4px;width:7px;height:7px;background:#ff0;border-radius:50%}

.month-selector{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.month-selector select{background:#222;color:#fff;border:1px solid #444;padding:8px 14px;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 0.3s;z-index:9998;
}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-box{
  background:#1e1e1e;border-radius:20px;max-height:92vh;overflow-y:auto;
  width:95vw;max-width:960px;box-shadow:0 25px 80px rgba(0,0,0,0.9);
  transform:translateY(20px);transition:transform 0.3s;
}
.modal-overlay.active .modal-box{transform:translateY(0)}
.modal-header{padding:20px 24px;border-bottom:1px solid #333;position:sticky;top:0;background:#1e1e1e;z-index:10;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:1.15rem;font-weight:700;color:#eee}
.modal-subtitle{font-size:0.8rem;color:#999;margin-top:2px}
.modal-close{background:none;border:none;font-size:1.3rem;color:#999;cursor:pointer;transition:0.2s}
.modal-close:hover{color:#fff}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid #333;display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:#1e1e1e}

.team-section{margin-bottom:20px}
.team-header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;margin-bottom:6px;font-weight:700;font-size:0.9rem}
.captacao{background:rgba(139,108,173,0.18);border-left:3px solid #8B6CAD;color:#b39ddb}
.consultoria{background:rgba(30,147,225,0.18);border-left:3px solid #1E93E1;color:#64b5f6}
.closer{background:rgba(227,6,19,0.18);border-left:3px solid #E30613;color:#ef9a9a}

.seller-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#252525;border-radius:6px;margin-bottom:4px;transition:0.2s;flex-wrap:wrap;gap:8px}
.seller-row:hover{background:#303030}
.seller-name{font-weight:600;font-size:0.88rem;min-width:130px}
.seller-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meeting-group{display:flex;align-items:center;gap:4px}
.meeting-group input[type="text"]{background:#1a1a1a;border:1px solid #444;color:#fff;padding:4px 8px;border-radius:6px;font-size:0.75rem;width:140px}
.meeting-group input[type="text"]:focus{outline:none;border-color:var(--bmw-light)}

.btn{padding:8px 16px;border-radius:50px;font-weight:700;font-size:0.78rem;cursor:pointer;border:none;transition:0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--bmw-blue);color:#fff}
.btn-primary:hover{background:var(--bmw-light)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:#e53935;color:#fff}
.btn-warning{background:#ff9800;color:#fff}
.btn-secondary{background:#444;color:#fff}
.toggle-btn{padding:5px 12px;border-radius:50px;border:none;cursor:pointer;font-weight:700;font-size:0.75rem;transition:0.2s}
.toggle-presente{background:#00c853;color:#fff}
.toggle-falta{background:#e53935;color:#fff}

table{width:100%;border-collapse:collapse;font-size:0.85rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #222}
th{background:#1a1a1a;color:var(--text-dim);font-weight:700;font-size:0.75rem;text-transform:uppercase}
tr:hover{background:rgba(255,255,255,0.02)}

#toastContainer{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:6px}
.toast{padding:12px 20px;border-radius:10px;font-size:0.85rem;font-weight:600;color:#fff;opacity:1;transition:opacity 0.3s}
.toast.success{background:#00c853}
.toast.error{background:#e53935}

.admin-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.admin-controls input{background:#1a1a1a;border:1px solid #444;color:#fff;padding:8px 14px;border-radius:8px;font-size:0.85rem;flex:1;min-width:300px}
.debug-box{background:#111;border:1px solid #333;border-radius:8px;padding:14px;margin:10px 0;font-size:0.8rem;color:#0f0;font-family:monospace;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

@media(max-width:768px){
  .header{padding:10px 14px;font-size:0.85rem}
  .tab-btn{padding:6px 10px;font-size:0.7rem}
  .main-content{padding:14px}
  .seller-row{flex-direction:column;align-items:flex-start}
  .modal-box{width:96vw;max-height:85vh}
}
</style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
  <div class="spinner" style="width:48px;height:48px;"></div>
  <div style="color:var(--text);font-size:1rem;font-weight:700;">Carregando dados do CSV...</div>
  <div id="loadingMsg" style="color:var(--text-dim);font-size:0.8rem;"></div>
</div>

<div id="loginOverlay" style="display:none;">
  <div class="login-box">
    <div class="bmw-stripes">
      <div class="bmw-stripe"></div><div class="bmw-stripe"></div><div class="bmw-stripe"></div>
    </div>
    <div class="login-logo">🏁</div>
    <div class="login-title">BMW CHAMPIONS LEAGUE</div>
    <div class="login-subtitle">Temporada 2026 • Julho a Dezembro</div>
    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="loginUser" placeholder="Usuário" autocomplete="off"/>
    </div>
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="loginPass" placeholder="Senha"/>
    </div>
    <button class="login-btn" onclick="doLogin()"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <header class="header">
    <div class="header-brand">
      <span class="icon">🏁</span><span class="title-text">BMW</span>
      <span class="champions">Champions League</span>
    </div>
    <div class="header-user">
      <div class="user-badge">
        <i class="fa-solid fa-circle-user"></i> <span id="headerUserName">Admin</span>
        <span class="role" id="headerUserRole">ADMIN</span>
      </div>
      <button class="logout-btn" onclick="doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="meus-numeros"><i class="fa-solid fa-gauge-high"></i> Meus Números</button>
    <button class="tab-btn" data-tab="ranking"><i class="fa-solid fa-trophy"></i> Ranking Geral</button>
    <button class="tab-btn" data-tab="presenca"><i class="fa-solid fa-calendar-check"></i> Lista de Presença</button>
    <button class="tab-btn admin-only" data-tab="status" style="display:none;"><i class="fa-solid fa-toggle-on"></i> Ativo/Inativo</button>
    <button class="tab-btn admin-only" data-tab="admin" style="display:none;"><i class="fa-solid fa-gear"></i> Admin</button>
    <button class="tab-btn" data-tab="regras"><i class="fa-solid fa-book"></i> Regras</button>
  </nav>

  <div class="main-content">
    <div class="tab-panel active" id="panel-meus-numeros"><div id="meusNumerosContent"></div></div>
    <div class="tab-panel" id="panel-ranking"><div id="rankingContent"></div></div>
    <div class="tab-panel" id="panel-presenca"><div id="presencaContent"></div></div>
    <div class="tab-panel" id="panel-status"><div id="statusContent"></div></div>
    <div class="tab-panel" id="panel-admin">
      <div class="section-title"><i class="fa-solid fa-gear"></i> Painel do Administrador</div>
      <div id="adminDebug" class="debug-box" style="display:none;"></div>
      <div id="adminDataTable" style="margin-top:14px;"></div>
    </div>
    <div class="tab-panel" id="panel-regras"><div id="regrasContent"></div></div>
  </div>
</div>

<div class="modal-overlay" id="presencaModal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-title"><i class="fa-solid fa-calendar-day"></i> Presença — <span id="modalDiaLabel">Dia 1</span></div>
        <div class="modal-subtitle" id="modalSubtitle">Julho 2026</div>
      </div>
      <button class="modal-close" onclick="closePresencaModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-success" onclick="marcarTodosModal(1)"><i class="fa-solid fa-check"></i> Todos Presentes</button>
      <button class="btn btn-danger" onclick="marcarTodosModal(0)"><i class="fa-solid fa-xmark"></i> Todos Faltaram</button>
      <button class="btn btn-warning" onclick="limparMeetingsModal()"><i class="fa-solid fa-eraser"></i> Limpar Meetings</button>
      <button class="btn btn-primary" onclick="salvarPresenca()"><i class="fa-solid fa-floppy-disk"></i> Salvar e Fechar</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ╔══════════════════════════════════════════════╗
// ║  🏁 BMW CHAMPIONS LEAGUE 2026             ║
// ║  ✅ URL DO CSV JÁ CONFIGURADA              ║
// ╚══════════════════════════════════════════════╝
const CSV_URL = 'https://raw.githubusercontent.com/Collinaditalia/DisputaBMWjulhoDezembro/main/dados.csv';

const MESES = ['Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_KEY = ['07','08','09','10','11','12'];
const DIAS_POR_MES = [31,31,30,31,30,31];
const XP_PRESENCA = 50000;
const XP_MEETING = 200000;

let currentUser = null;
let rawCSV = [];
let professionals = [];
let mesAtual = 0;
let modalDia = 1;
let modalPresenca = {};
let modalMeeting = {};

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  loadCSV();
});

function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  err.textContent = '';

  if(u==='admin' && p==='admin123'){
    currentUser = {name:'Administrador',role:'admin'};
    showDashboard(); return;
  }

  const prof = professionals.find(x=>x.nome.toLowerCase()===u && x.senha===p);
  if(prof){
    currentUser = {name:prof.nome,role:'vendedor',team:prof.equipe};
    showDashboard();
  } else {
    err.textContent = 'Usuário ou senha inválidos';
  }
}

function showDashboard(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('dashboard').style.display='block';
  updateUI();
  switchTab('meus-numeros');
}

function doLogout(){
  currentUser = null;
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('dashboard').style.display='none';
}

function updateUI(){
  document.getElementById('headerUserName').textContent = currentUser?.name||'';
  document.getElementById('headerUserRole').textContent = currentUser?.role==='admin'?'ADMIN':(currentUser?.team||'VENDEDOR');
  document.querySelectorAll('.admin-only').forEach(e=>e.style.display=currentUser?.role==='admin'?'':'none');
}

function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('panel-'+tab);
  const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if(panel) panel.classList.add('active');
  if(btn) btn.classList.add('active');

  const renders = {
    'meus-numeros': renderMeusNumeros,
    'ranking': renderRanking,
    'presenca': renderPresenca,
    'status': renderStatus,
    'admin': renderAdmin,
    'regras': renderRegras
  };
  if(renders[tab]) renders[tab]();
}

async function loadCSV(){
  const debug = document.getElementById('adminDebug');
  const msg = document.getElementById('loadingMsg');

  if(debug){ debug.style.display = 'block'; debug.textContent = '🔄 Iniciando carregamento...\n'; }
  if(msg) msg.textContent = 'Conectando ao GitHub...';

  try{
    if(msg) msg.textContent = 'Baixando dados.csv...';
    const resp = await fetch(CSV_URL);
    if(!resp.ok) throw new Error(`HTTP ${resp.status} — verifique se o link está correto`);

    const txt = await resp.text();
    if(debug) debug.textContent += `✓ Arquivo recebido: ${txt.length} caracteres\n`;

    const firstLine = txt.split('\n')[0].trim();
    let delim = ',';
    if(firstLine.includes(';') && firstLine.split(';').length > firstLine.split(',').length) delim = ';';
    if(debug) debug.textContent += `✓ Delimitador: "${delim}"\n`;

    rawCSV = parseCSV(txt, delim);
    if(rawCSV.length === 0) throw new Error('CSV vazio ou mal formatado');
    if(debug) debug.textContent += `✓ ${rawCSV.length} linhas de dados carregadas\n`;

    const headers = Object.keys(rawCSV[0]);
    if(debug){
      debug.textContent += `✓ ${headers.length} colunas encontradas:\n`;
      headers.forEach((h,i) => {
        debug.textContent += `  [${i}] "${h}" → "${(rawCSV[0][h]||'').substring(0,40)}"\n`;
      });
    }

    const cols = detectarColunas(headers);
    if(debug){
      debug.textContent += `\n🔍 Mapeamento de colunas:\n`;
      debug.textContent += `  Captador    → col [${cols.captador}] "${headers[cols.captador]||'N/D'}"\n`;
      debug.textContent += `  Consultor   → col [${cols.consultor}] "${headers[cols.consultor]||'N/D'}"\n`;
      debug.textContent += `  Closer      → col [${cols.closer}] "${headers[cols.closer]||'N/D'}"\n`;
      debug.textContent += `  VGV         → col [${cols.vgv}] "${headers[cols.vgv]||'N/D'}"\n`;
      debug.textContent += `  Status      → col [${cols.status}] "${headers[cols.status]||'N/D'}"\n`;
    }

    if(cols.captador<0||cols.consultor<0||cols.closer<0){
      throw new Error(
        'Não foi possível encontrar uma ou mais colunas.\n' +
        'Verifique se o CSV tem colunas com os nomes:\n' +
        '  - "promotor de marketing" ou "captador"\n' +
        '  - "consultor"\n' +
        '  - "closer"'
      );
    }

    professionals = extrairProfissionais(rawCSV, cols, headers);
    if(debug){
      debug.textContent += `\n✅ ${professionals.length} PROFISSIONAIS EXTRAÍDOS:\n`;
      professionals.sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p => {
        debug.textContent += `  • ${p.nome.padEnd(20)} | ${p.equipe.padEnd(12)} | VGV: ${formatCurrency(p.vgv)} | Vendas: ${p.vendas}\n`;
      });
    }

    if(msg) msg.textContent = `${professionals.length} profissionais carregados!`;

    setTimeout(()=>{
      document.getElementById('loadingOverlay').style.display='none';
      document.getElementById('loginOverlay').style.display='flex';
    }, 600);

    showToast(`${professionals.length} profissionais carregados!`,'success');

  } catch(e){
    if(debug) debug.textContent += `\n❌ ERRO: ${e.message}`;
    if(msg) msg.innerHTML = `<span style="color:#e53935;">❌ ${e.message}</span><br>
      <button onclick="loadCSV()" style="margin-top:12px;padding:8px 16px;background:#0066B1;color:#fff;border:none;border-radius:6px;cursor:pointer;">Tentar novamente</button>`;
    showToast('Erro ao carregar CSV: '+e.message,'error');
  }
}

function parseCSV(txt, delim){
  const lines = txt.trim().split('\n');
  if(lines.length < 2) return [];

  const headers = splitCSV(lines[0], delim).map(h=>h.trim());

  const data = [];
  for(let i=1; i<lines.length; i++){
    const vals = splitCSV(lines[i], delim);
    if(vals.length < 2) continue;
    const obj = {};
    headers.forEach((h,j) => { obj[h] = (vals[j]||'').trim(); });
    data.push(obj);
  }
  return data;
}

function splitCSV(line, delim){
  const result = [];
  let current = '', inQuotes = false;
  for(let i=0; i<line.length; i++){
    const ch = line[i];
    if(ch === '"'){ inQuotes = !inQuotes; }
    else if(ch === delim && !inQuotes){ result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

function detectarColunas(headers){
  const hNorm = headers.map(h => h.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
  );

  const find = (palavrasChave) => {
    for(const kw of palavrasChave){
      for(let i=0; i<headers.length; i++){
        if(hNorm[i] === kw) return i;
      }
      for(let i=0; i<headers.length; i++){
        if(hNorm[i].includes(kw)) return i;
      }
    }
    return -1;
  };

  const captador = find([
    'promotor de marketing','promotor marketing','promotor',
    'captador','captacao','captador de marketing','capta',
    'marketing','promo'
  ]);
  const consultor = find([
    'consultor','consultoria','consultor de vendas','consult'
  ]);
  const closer = find([
    'closer','fechador','closer de vendas','close','finalizador'
  ]);
  const vgv = find([
    'vgv','valor total','valor venda','valor','valor bruto','total','receita'
  ]);
  const status = find([
    'status do contrato','status contrato','status','situacao','contrato','situacao contrato'
  ]);

  return { captador, consultor, closer, vgv, status };
}

function parseStatus(raw){
  if(!raw||raw.trim()==='') return {ativos:0, total:0};
  const partes = raw.toUpperCase().split('#').map(s=>s.trim()).filter(s=>s.length>0);
  let ativos = 0;
  for(const p of partes){
    if(p==='ATIVO'||p.includes('ATIVO')) ativos++;
  }
  return {ativos, total: partes.length};
}

function extrairProfissionais(raw, cols, headers){
  const colCaptador = headers[cols.captador];
  const colConsultor = headers[cols.consultor];
  const colCloser = headers[cols.closer];
  const colVGV = cols.vgv>=0 ? headers[cols.vgv] : null;
  const colStatus = cols.status>=0 ? headers[cols.status] : null;

  const mapa = {};

  for(const row of raw){
    const captador = (row[colCaptador]||'').trim();
    const consultor = (row[colConsultor]||'').trim();
    const closer = (row[colCloser]||'').trim();

    const statusRaw = colStatus ? (row[colStatus]||'') : '';
    const {ativos, total} = parseStatus(statusRaw);

    if(ativos === 0) continue;

    let vgvVal = 0;
    if(colVGV){
      const rawV = (row[colVGV]||'').replace(/[R\$\s\.]/g,'').replace(',','.');
      vgvVal = parseFloat(rawV) || 0;
    }

    const envolvidos = [
      {nome: captador, equipe: 'CAPTACAO'},
      {nome: consultor, equipe: 'CONSULTORIA'},
      {nome: closer, equipe: 'CLOSER'}
    ];

    for(const {nome, equipe} of envolvidos){
      if(!nome || nome==='') continue;
      const key = nome+'|'+equipe;
      if(!mapa[key]){
        mapa[key] = {nome, equipe, vgv:0, vendas:0, vendas_total:0};
      }
      mapa[key].vgv += vgvVal;
      mapa[key].vendas += ativos;
      mapa[key].vendas_total += total;
    }
  }

  const lista = Object.values(mapa).map(p => ({
    ...p,
    senha: (p.nome||'').toLowerCase().replace(/\s/g,'').substring(0,10),
    ativo: getAtivo(p.nome)
  }));

  return lista;
}

function getAtivo(nome){
  const d = JSON.parse(localStorage.getItem('bmw_ativo_2026')||'{}');
  return d[nome] !== false;
}
function setAtivo(nome,val){
  const d = JSON.parse(localStorage.getItem('bmw_ativo_2026')||'{}');
  d[nome] = val;
  localStorage.setItem('bmw_ativo_2026', JSON.stringify(d));
}

function presencaKey(mes){ return `bmw_presenca_2026_${MESES_KEY[mes]}`; }
function meetingKey(mes){ return `bmw_meeting_2026_${MESES_KEY[mes]}`; }

function getDayPresenca(mes, dia){
  const d = JSON.parse(localStorage.getItem(presencaKey(mes))||'{}');
  return d[String(dia).padStart(2,'0')] || {};
}
function setDayPresenca(mes, dia, val){
  const k = presencaKey(mes);
  const d = JSON.parse(localStorage.getItem(k)||'{}');
  d[String(dia).padStart(2,'0')] = val;
  localStorage.setItem(k, JSON.stringify(d));
}
function getDayMeeting(mes, dia){
  const d = JSON.parse(localStorage.getItem(meetingKey(mes))||'{}');
  return d[String(dia).padStart(2,'0')] || {};
}
function setDayMeeting(mes, dia, val){
  const k = meetingKey(mes);
  const d = JSON.parse(localStorage.getItem(k)||'{}');
  d[String(dia).padStart(2,'0')] = val;
  localStorage.setItem(k, JSON.stringify(d));
}

function countPresencasTotal(nome){
  let c=0;
  for(let m=0;m<6;m++){
    for(let d=1;d<=DIAS_POR_MES[m];d++){
      const day = getDayPresenca(m,d);
      if(day[nome]===1) c++;
    }
  }
  return c;
}
function countMeetingsTotal(nome){
  let c=0;
  for(let m=0;m<6;m++){
    for(let d=1;d<=DIAS_POR_MES[m];d++){
      const day = getDayMeeting(m,d);
      if(day[nome]) c++;
    }
  }
  return c;
}
function calcXP(p){
  const peso = p.equipe==='CAPTACAO'?1200:p.equipe==='CONSULTORIA'?1100:1000;
  let xp = (p.vgv/1000)*peso;
  xp += countPresencasTotal(p.nome)*XP_PRESENCA;
  xp += countMeetingsTotal(p.nome)*XP_MEETING;
  return Math.round(xp);
}

function formatCurrency(v){
  if(!v||isNaN(v)) return 'R$ 0';
  return 'R$ '+Math.round(v).toLocaleString('pt-BR');
}
function formatXP(v){
  if(!v||isNaN(v)) return '0 XP';
  return Math.round(v).toLocaleString('pt-BR')+' XP';
}
function escJS(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function escHTML(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPresenca(){
  const el = document.getElementById('presencaContent');
  if(!el) return;

  const ativos = getAtivos();
  const diasMes = DIAS_POR_MES[mesAtual];

  let pres=0,falt=0,meet=0;
  for(let d=1;d<=diasMes;d++){
    const pd = getDayPresenca(mesAtual,d);
    const md = getDayMeeting(mesAtual,d);
    ativos.forEach(p=>{
      if(pd[p.nome]===1) pres++;
      if(pd[p.nome]===0) falt++;
      if(md[p.nome]) meet++;
    });
  }

  let h = `
    <div class="section-title"><i class="fa-solid fa-calendar-check"></i> Lista de Presença</div>
    <div class="month-selector">
      <label>📅 Mês:</label>
      <select id="mesSelector" onchange="changeMes(this.value)">
        ${MESES.map((m,i)=>`<option value="${i}" ${i===mesAtual?'selected':''}>${m} 2026</option>`).join('')}
      </select>
      <span style="font-size:0.8rem;color:var(--text-dim);">
        ✅ ${pres} presenças | ❌ ${falt} faltas | 🎤 ${meet} meetings
      </span>
    </div>
  `;

  const offsetDias = [3,5,1,3,0,2];
  const inicio = offsetDias[mesAtual];

  h += `<div class="calendar-grid">`;
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d=>h+=`<div class="calendar-day-header">${d}</div>`);
  for(let i=0;i<inicio;i++) h+=`<div></div>`;

  const hoje = new Date();
  for(let d=1;d<=diasMes;d++){
    const pd = getDayPresenca(mesAtual,d);
    const md = getDayMeeting(mesAtual,d);
    const mesNum = parseInt(MESES_KEY[mesAtual]);
    const isFuture = mesNum > hoje.getMonth()+1 || (mesNum === hoje.getMonth()+1 && d > hoje.getDate());

    let cls='day-undefined', lbl='—';
    let pC=0, fC=0, hasMtg=false;

    if(!isFuture && Object.keys(pd).length>0){
      ativos.forEach(p=>{
        if(pd[p.nome]===1) pC++;
        if(pd[p.nome]===0) fC++;
        if(md[p.nome]) hasMtg=true;
      });
      if(pC>0&&fC===0){ cls='day-todos-presentes'; lbl=`${pC}P`; }
      else if(fC>0&&pC===0){ cls='day-todos-falta'; lbl=`${fC}F`; }
      else if(pC>0&&fC>0){ cls='day-parcial'; lbl=`${pC}/${fC}`; }
    }

    if(isFuture) cls='day-future';
    const clicavel = currentUser?.role==='admin' && !isFuture;

    h += `<div class="calendar-day ${cls}" ${clicavel?`onclick="openPresencaModal(${d})"`:''} title="${MESES[mesAtual]} ${d}">
      <div>${d}</div><small>${lbl}</small>
      ${hasMtg?'<div class="day-meeting-dot"></div>':''}
    </div>`;
  }
  h += `</div>`;

  h += `<p style="margin-top:12px;font-size:0.78rem;color:var(--text-dim);">
    💡 <b>Admin:</b> clique no dia para abrir | 🟡 = dia com meeting</p>`;

  el.innerHTML = h;
}

    ${professionals.length} profissionais | ${rawCSV.length} linhas no CSV | URL: <code style="color:var(--bmw-light);">${CSV_URL}</code></p>`;
  h += `<table><thead><tr><th>Nome</th><th>Equipe</th><th>VGV</th><th>Vendas Líq.</th><th>Vendas Tot.</th><th>Pres.</th><th>Meet.</th><th>XP</th></tr></thead><tbody>`;
  [...professionals].sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p=>{
    h += `<tr><td>${p.nome}</td><td>${p.equipe}</td><td>${formatCurrency(p.vgv)}</td><td>${p.vendas}</td><td>${p.vendas_total}</td>
      <td>${countPresencasTotal(p.nome)}</td><td>${countMeetingsTotal(p.nome)}</td><td style="font-weight:800;">${formatXP(calcXP(p))}</td></tr>`;
  });
  h += `</tbody></table>`;
  el.innerHTML = h;
}

function getAtivos(){ return professionals.filter(p=>p.ativo); }

function renderAll(){
  const tab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(tab==='meus-numeros') renderMeusNumeros();
  if(tab==='ranking') renderRanking();
  if(tab==='presenca') renderPresenca();
  if(tab==='status') renderStatus();
  if(tab==='admin') renderAdmin();
}

function showToast(msg,tipo='success'){
  const ct = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast '+(tipo==='error'?'error':'success');
  t.textContent = msg;
  ct.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); },3500);
}
</script>
